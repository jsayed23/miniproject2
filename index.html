tElementById('openPrefs').addEventListener('click', (e) => {\n  e.preventDefault();\n  showScreen('home');\n  const panel = document.getElementById('prefsPanel');\n  panel.open = true;\n  setTimeout(() => panel.scrollIntoView({ behavior: state.motion === 'none' ? 'auto' : 'smooth', block: 'start' }), 80);\n});\n\n/* =========================================================================\n   LIBRARY\n   ========================================================================= */\n/* True when a passage matches the active grade and learning-need filters.\n   Language is not a filter here \u2014 it switches content, not the visible set. */\nfunction passesFilters(p) {\n  const grades = [...filterState.grade];\n  if (grades.length && !grades.some(g => p.gmin <= +g && +g <= p.gmax)) return false;\n  if (filterState.need.size && ![...filterState.need].some(n => p.needs.includes(n))) return false;\n  return true;\n}\nfunction updateLibStats() {\n  const ids = new Set(PASSAGES.map(p => p.id));\n  const total = PASSAGES.length;\n  const read = Object.keys(state.read).filter(id => ids.has(id)).length;\n  const cats = new Set(PASSAGES.map(p => p.cat)).size;\n  const mins = PASSAGES.reduce((s, p) => s + (p.minutes || 0), 0);\n  const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };\n  set('statTotal', total);\n  set('statRead', read);\n  set('statCats', cats);\n  set('statTime', '~' + mins);\n}\n\nfunction renderLibrary() {\n  const grid = document.getElementById('grid-all');\n  if (!grid) return;\n\n  updateLibStats();\n\n  // Render every visible passage into the carousel.\n  const visible = PASSAGES.filter(passesFilters);\n  grid.innerHTML = '';\n  visible.forEach(p => {\n    const lp = L(p);\n    const done = !!state.read[p.id];\n    const card = document.createElement('button');\n    card.className = 'passage-card p-' + p.cat;\n    card.setAttribute('role', 'listitem');\n    card.setAttribute('data-voice', lp.title);\n    const icon = PASSAGE_ICONS[p.id] || '';\n    const preview = (lp.paragraphs[0] || '').replace(/\\s+/g, ' ').trim().slice(0, 140);\n    const needsTags = (p.needs || [])\n      .map(n => `<span class=\"p-tag t-${n}\">${t('need_' + n)}<\/span>`)\n      .join('');\n    card.innerHTML = `\n      <div class=\"p-top\">\n        ${icon ? `<span class=\"p-icon\" aria-hidden=\"true\">${icon}<\/span>` : ''}\n        <span class=\"p-cat-label\">${t('cat_' + p.cat)}<\/span>\n        ${done ? `<span class=\"p-done-badge\" aria-label=\"${t('read_done')}\">\u2713<\/span>` : ''}\n      <\/div>\n      <h3>${lp.title}<\/h3>\n      <p class=\"preview\">${preview}\u2026<\/p>\n      ${needsTags ? `<div class=\"p-tags\">${needsTags}<\/div>` : ''}\n      <div class=\"p-foot\">\n        <span class=\"p-foot-item\"><span class=\"fi-ic\" aria-hidden=\"true\">\u23f1<\/span>${t('min_label', { n: p.minutes })}<\/span>\n        <span class=\"p-foot-item\"><span class=\"fi-ic\" aria-hidden=\"true\">\ud83d\udcc8<\/span>${t('level_' + p.level)}<\/span>\n        <span class=\"p-foot-item\"><span class=\"fi-ic\" aria-hidden=\"true\">\ud83c\udf93<\/span>${p.gmin}\u2013${p.gmax}<\/span>\n      <\/div>\n    `;\n    card.addEventListener('click', () => openPassage(p.id));\n    grid.appendChild(card);\n  });\n\n  // Empty state.\n  const lib = document.getElementById('library');\n  let emptyEl = document.getElementById('libEmpty');\n  if (visible.length === 0) {\n    if (!emptyEl) { emptyEl = document.createElement('p'); emptyEl.id = 'libEmpty'; emptyEl.className = 'lib-empty'; lib.appendChild(emptyEl); }\n    emptyEl.textContent = t('empty_shelf');\n    emptyEl.style.display = '';\n  } else if (emptyEl) { emptyEl.style.display = 'none'; }\n\n  buildCarouselDots();\n  updateCarouselNav();\n}\n\n/* Library carousel \u2014 arrow navigation, dot indicators, edge state. */\nfunction updateCarouselNav() {\n  const track = document.getElementById('grid-all');\n  const prev = document.getElementById('libPrev');\n  const next = document.getElementById('libNext');\n  if (track && prev && next) {\n    const max = track.scrollWidth - track.clientWidth - 2;\n    prev.disabled = track.scrollLeft <= 2;\n    next.disabled = track.scrollLeft >= max;\n  }\n  updateActiveDot();\n}\nfunction scrollToCard(card) {\n  const track = document.getElementById('grid-all');\n  if (!track || !card) return;\n  const left = card.getBoundingClientRect().left - track.getBoundingClientRect().left + track.scrollLeft;\n  track.scrollTo({ left, behavior: state.motion === 'none' ? 'auto' : 'smooth' });\n}\nfunction buildCarouselDots() {\n  const track = document.getElementById('grid-all');\n  const dots = document.getElementById('libDots');\n  if (!track || !dots) return;\n  const cards = track.querySelectorAll('.passage-card');\n  dots.innerHTML = '';\n  dots.style.display = cards.length > 1 ? '' : 'none';\n  cards.forEach((card, i) => {\n    const d = document.createElement('button');\n    d.type = 'button';\n    d.className = 'carousel-dot';\n    d.setAttribute('aria-label', 'Go to passage ' + (i + 1));\n    d.addEventListener('click', () => scrollToCard(card));\n    dots.appendChild(d);\n  });\n}\nfunction updateActiveDot() {\n  const track = document.getElementById('grid-all');\n  const dots = document.getElementById('libDots');\n  if (!track || !dots) return;\n  const cards = track.querySelectorAll('.passage-card');\n  const dotEls = dots.querySelectorAll('.carousel-dot');\n  if (!cards.length) return;\n  const trackLeft = track.getBoundingClientRect().left;\n  let activeIdx = 0, min = Infinity;\n  cards.forEach((c, i) => {\n    const dist = Math.abs(c.getBoundingClientRect().left - trackLeft);\n    if (dist < min) { min = dist; activeIdx = i; }\n  });\n  dotEls.forEach((d, i) => d.classList.toggle('active', i === activeIdx));\n}\nfunction scrollCarousel(dir) {\n  const track = document.getElementById('grid-all');\n  if (!track) return;\n  const card = track.querySelector('.passage-card');\n  const step = card ? card.offsetWidth + 32 : 340;\n  track.scrollBy({ left: dir * step, behavior: state.motion === 'none' ? 'auto' : 'smooth' });\n}\n(function wireCarousel() {\n  const track = document.getElementById('grid-all');\n  const prev = document.getElementById('libPrev');\n  const next = document.getElementById('libNext');\n  if (prev) prev.addEventListener('click', () => scrollCarousel(-1));\n  if (next) next.addEventListener('click', () => scrollCarousel(1));\n  if (track) track.addEventListener('scroll', updateCarouselNav, { passive: true });\n  window.addEventListener('resize', updateCarouselNav);\n})();\n\n/* =========================================================================\n   READER + SPEECH\n   ========================================================================= */\nlet currentPassage = null;\nlet wordEls = [];\nlet utter = null;\nlet speaking = false;\n\n/**\n * Opens a passage in the reader view: renders the eyebrow / title / meta /\n * paragraph-progress dots, tokenizes the body into <span class=\"word\"> elements\n * for read-aloud sync, wraps vocab keywords in <span class=\"vocab\"> elements\n * for tap-to-define popovers, wires up an IntersectionObserver to light up\n * progress dots as paragraphs scroll into view, and prefills the reflection\n * textarea with any saved note from a previous session.\n *\n * @param {string} id - The PASSAGES[*].id of the passage to open. No-op if not found.\n * @returns {void} - All side effects are DOM mutations and a screen transition.\n */\nfunction openPassage(id) {\n  const p = PASSAGES.find(x => x.id === id);\n  if (!p) return;\n  currentPassage = p;\n  const lp = L(p);\n  document.getElementById('readerEyebrow').textContent = t('cat_' + p.cat).toUpperCase();\n  document.getElementById('reader-title').textContent = lp.title;\n  document.getElementById('reader-meta').innerHTML = `\n    <span>${t('cat_' + p.cat)}<\/span>\n    <span class=\"text-soft\">\u00b7<\/span>\n    <span>${t('min_label', { n: p.minutes })}<\/span>\n    <span class=\"text-soft\">\u00b7<\/span>\n    <span>${t('level_' + p.level)}<\/span>\n  `;\n\n  // Paragraph progress indicator\n  const paraEl = document.getElementById('paraProgress');\n  paraEl.innerHTML = `<span>${t('n_paragraphs', { n: lp.paragraphs.length })}<\/span><span class=\"dots\">${\n    lp.paragraphs.map((_, i) => `<span class=\"dot\" data-para=\"${i}\"><\/span>`).join('')\n  }<\/span>`;\n  // Mark dots as the user scrolls through paragraphs\n  const paraDots = paraEl.querySelectorAll('.dot');\n\n  // Build vocab lookup: lowercase whole word \u2192 definition\n  const vocabMap = {};\n  (lp.vocab || []).forEach(v => { vocabMap[v.word.toLowerCase()] = v.def; });\n\n  const body = document.getElementById('passageBody');\n  body.innerHTML = '';\n  wordEls = [];\n  const paraEls = [];\n\n  lp.paragraphs.forEach((para, paraIdx) => {\n    const pEl = document.createElement('p');\n    pEl.dataset.para = paraIdx;\n    const tokens = para.split(/(\\s+)/);\n    tokens.forEach(token => {\n      if (/^\\s+$/.test(token)) {\n        pEl.appendChild(document.createTextNode(token));\n      } else {\n        // Strip surrounding punctuation for vocab match\n        const clean = token.toLowerCase().replace(/^[^\\w]+|[^\\w]+$/g, '');\n        const isVocab = vocabMap[clean];\n        if (isVocab) {\n          // Render with vocab wrapping\n          const leading = token.match(/^[^\\w]+/)?.[0] || '';\n          const trailing = token.match(/[^\\w]+$/)?.[0] || '';\n          const core = token.slice(leading.length, token.length - trailing.length);\n          if (leading) pEl.appendChild(document.createTextNode(leading));\n          const vSpan = document.createElement('span');\n          vSpan.className = 'vocab';\n          vSpan.tabIndex = 0;\n          vSpan.setAttribute('role', 'button');\n          vSpan.setAttribute('aria-label', `${core}: tap for definition`);\n          vSpan.dataset.def = isVocab;\n          vSpan.dataset.word = clean;\n          // The word's letters also get word-span treatment for speech-sync\n          const wSpan = document.createElement('span');\n          wSpan.className = 'word';\n          wSpan.textContent = core;\n          vSpan.appendChild(wSpan);\n          pEl.appendChild(vSpan);\n          wordEls.push(wSpan);\n          if (trailing) pEl.appendChild(document.createTextNode(trailing));\n        } else {\n          const span = document.createElement('span');\n          span.className = 'word';\n          span.textContent = token;\n          pEl.appendChild(span);\n          wordEls.push(span);\n        }\n      }\n    });\n    body.appendChild(pEl);\n    paraEls.push(pEl);\n  });\n\n  // Wire vocab clicks\n  body.querySelectorAll('.vocab').forEach(v => {\n    v.addEventListener('click', (e) => { e.stopPropagation(); showVocabPop(v); });\n    v.addEventListener('focus', () => showVocabPop(v));\n    v.addEventListener('blur', () => closeVocabPop());\n  });\n\n  // Paragraph scroll observer\n  if ('IntersectionObserver' in window) {\n    if (window.__paraObserver) window.__paraObserver.disconnect();\n    window.__paraObserver = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          const idx = parseInt(e.target.dataset.para, 10);\n          // Light up the dot up to this paragraph\n          paraDots.forEach((d, i) => d.classList.toggle('read', i <= idx));\n        }\n      });\n    }, { threshold: 0.4 });\n    paraEls.forEach(el => window.__paraObserver.observe(el));\n  }\n\n  // Reflection panel \u2014 prefill with saved note if any\n  const savedNote = (state.reflections && state.reflections[id]) || '';\n  const reflectText = document.getElementById('reflectText');\n  reflectText.value = savedNote;\n  document.getElementById('reflectCount').textContent = `${savedNote.length} / 280`;\n  document.getElementById('reflectPrompt').textContent = lp.prompt || '';\n  // Show previous reflection inline (if any)\n  const prevWrap = document.getElementById('prevReflection');\n  if (savedNote) {\n    document.getElementById('prevReflectionText').textContent = savedNote;\n    prevWrap.hidden = false;\n  } else {\n    prevWrap.hidden = true;\n  }\n\n  document.getElementById('paceLive').value = state.pace;\n  document.getElementById('paceLiveVal').textContent = state.pace.toFixed(1) + '\u00d7';\n  document.getElementById('playBtn').hidden = !state.audio;\n  closeVocabPop();\n  showScreen('reader');\n}\n\n/* ----- Vocab popover ----- */\nlet activePop = null;\nfunction closeVocabPop() {\n  if (activePop) { activePop.remove(); activePop = null; }\n}\nfunction showVocabPop(el) {\n  closeVocabPop();\n  const pop = document.createElement('div');\n  pop.className = 'vocab-pop';\n  pop.innerHTML = `<span class=\"word\">${el.dataset.word}<\/span>${el.dataset.def}`;\n  document.body.appendChild(pop);\n  // Position above the word\n  const rect = el.getBoundingClientRect();\n  pop.style.left = Math.max(8, Math.min(window.innerWidth - 280, rect.left + window.scrollX - 8)) + 'px';\n  pop.style.top  = (rect.top + window.scrollY - pop.offsetHeight - 10) + 'px';\n  // Defer adding 'open' class to allow transition\n  requestAnimationFrame(() => pop.classList.add('open'));\n  activePop = pop;\n}\ndocument.addEventListener('click', (e) => {\n  if (activePop && !e.target.closest('.vocab')) closeVocabPop();\n});\nwindow.addEventListener('scroll', () => closeVocabPop(), { passive: true });\n\ndocument.getElementById('backToLib').addEventListener('click', () => showScreen('home'));\n\n// Reflection textarea \u2014 live char count, save on every change\nconst reflectText = document.getElementById('reflectText');\nreflectText.addEventListener('input', () => {\n  if (!currentPassage) return;\n  document.getElementById('reflectCount').textContent = `${reflectText.value.length} / 280`;\n  state.reflections[currentPassage.id] = reflectText.value;\n  saveState();\n});\n\ndocument.getElementById('markRead').addEventListener('click', () => {\n  if (!currentPassage) return;\n  state.read[currentPassage.id] = new Date().toISOString();\n  // Save the reflection one last time (in case input event didn't fire)\n  state.reflections[currentPassage.id] = reflectText.value;\n  saveState();\n  checkAchievements();\n  showCompletion(currentPassage);\n});\n\n/* =========================================================================\n   COMPLETION SCREEN \u2014 smart \"what's next\" suggestion\n   ========================================================================= */\n/**\n * Routes to the completion screen after a reader marks a passage read, and\n * computes a \"smart next\" suggestion: prefer the first unread passage in the\n * same category; fall back to any unread passage; fall back to a warm\n * \"you've read everything\" state if the library is complete.\n *\n * @param {object} passage - The PASSAGES[*] object just marked read.\n * @returns {void} - Updates the completion-screen DOM and transitions to it.\n */\nfunction showCompletion(passage) {\n  document.getElementById('complete-title').textContent = t('complete_title', { t: '\u201c' + L(passage).title + '\u201d' });\n  // Surface the reflection-saved line if there was a note\n  const saved = (state.reflections[passage.id] || '').trim();\n  document.getElementById('completeSaved').hidden = saved.length === 0;\n\n  // Smart next suggestion\n  // 1) prefer an unread passage in the same category\n  // 2) then any unread passage\n  // 3) else show \"all done\" message\n  const unread = PASSAGES.filter(x => !state.read[x.id]);\n  const sameCat = unread.filter(x => x.cat === passage.cat);\n  const next = sameCat[0] || unread[0] || null;\n\n  const nextSuggest = document.getElementById('nextSuggest');\n  const allDone = document.getElementById('allDone');\n  if (next) {\n    nextSuggest.hidden = false;\n    allDone.hidden = true;\n    document.getElementById('nextMeta').innerHTML = t('cat_' + next.cat) + ' \u00b7 ' + t('min_label', { n: next.minutes }) + ' \u00b7 ' + t('level_' + next.level);\n    document.getElementById('nextTitle').textContent = L(next).title;\n    document.getElementById('nextPreview').textContent = L(next).paragraphs[0].slice(0, 110) + '\u2026';\n    document.getElementById('nextCard').onclick = () => openPassage(next.id);\n    document.getElementById('nextCard').setAttribute('data-voice', L(next).title);\n  } else {\n    nextSuggest.hidden = true;\n    allDone.hidden = false;\n  }\n  showScreen('complete');\n}\ndocument.getElementById('completeBack').addEventListener('click', () => showScreen('home'));\ndocument.getElementById('paceLive').addEventListener('input', (e) => {\n  state.pace = parseFloat(e.target.value);\n  if (state.pace < state.minPace) state.minPace = state.pace;\n  document.getElementById('paceLiveVal').textContent = state.pace.toFixed(1) + '\u00d7';\n  saveState(); syncPrefsUI(); checkAchievements();\n  if (speaking) restartSpeech();\n});\n\nfunction getFullText() { return currentPassage ? L(currentPassage).paragraphs.join('\\n\\n') : ''; }\nfunction clearSpoken() { wordEls.forEach(w => w.classList.remove('spoken')); }\n\n/**\n * Reads the current passage aloud using the browser's Web Speech API and\n * highlights each word as it's spoken by listening to the SpeechSynthesis\n * `boundary` event and mapping the spoken char index back to a pre-tokenized\n * array of word-span elements. Also marks `state.usedAudioOnce = true` to\n * unlock the \"Read along\" achievement.\n *\n * @returns {void} - Alerts and bails out if the browser has no speechSynthesis;\n *   otherwise starts speech and updates the play/stop UI.\n */\nfunction speak() {\n  if (!('speechSynthesis' in window)) {\n    alert(\"Your browser doesn't support read-aloud. The text is still here to read at your own pace.\");\n    return;\n  }\n  stopSpeaking();\n  // Mark that audio was used (achievement)\n  if (!state.usedAudioOnce) { state.usedAudioOnce = true; saveState(); checkAchievements(); }\n  const text = getFullText();\n  utter = new SpeechSynthesisUtterance(text);\n  utter.rate = state.pace;\n  utter.pitch = 1;\n  utter.lang = speechTagFor(state.lang);\n  try {\n    const voices = speechSynthesis.getVoices() || [];\n    const want = utter.lang.slice(0, 2).toLowerCase();\n    const v = voices.find(vo => (vo.lang || '').toLowerCase().startsWith(want));\n    if (v) utter.voice = v;\n  } catch (e) {}\n\n  const offsets = [];\n  const regex = /\\S+/g;\n  let m;\n  while ((m = regex.exec(text)) !== null) {\n    offsets.push({ start: m.index, end: m.index + m[0].length });\n  }\n  let idx = 0;\n  utter.onboundary = (e) => {\n    if (e.name !== 'word') return;\n    while (idx < offsets.length && offsets[idx].end <= e.charIndex) idx++;\n    clearSpoken();\n    if (idx < wordEls.length) {\n      wordEls[idx].classList.add('spoken');\n      const rect = wordEls[idx].getBoundingClientRect();\n      if (rect.bottom > window.innerHeight - 80 || rect.top < 100) {\n        wordEls[idx].scrollIntoView({\n          behavior: state.motion === 'none' ? 'auto' : 'smooth',\n          block: 'center'\n        });\n      }\n    }\n  };\n  utter.onend = () => { speaking = false; togglePlayUI(false); clearSpoken(); };\n  utter.onerror = () => { speaking = false; togglePlayUI(false); };\n  speechSynthesis.speak(utter);\n  speaking = true;\n  togglePlayUI(true);\n}\nfunction stopSpeaking() {\n  if ('speechSynthesis' in window) speechSynthesis.cancel();\n  speaking = false;\n  togglePlayUI(false);\n  clearSpoken();\n}\nfunction restartSpeech() { if (speaking) speak(); }\nfunction togglePlayUI(playing) {\n  document.getElementById('playBtn').hidden = playing || !state.audio;\n  document.getElementById('stopBtn').hidden = !playing;\n}\ndocument.getElementById('playBtn').addEventListener('click', speak);\ndocument.getElementById('stopBtn').addEventListener('click', stopSpeaking);\n\n/* =========================================================================\n   ACHIEVEMENTS\n   ========================================================================= */\n/**\n * Checks every achievement-unlock condition against current state and\n * surfaces newly-earned badges as toast notifications. Idempotent: an\n * achievement already in `state.achievements` is not re-triggered.\n * Conditions cover passage counts (1/3/all), font exploration (OpenDyslexic),\n * theme exploration (dark/soft/high), audio use, slow pace (\u22640.7\u00d7), and\n * reading from all three categories.\n *\n * @returns {void} - Mutates state.achievements, persists, and queues toasts.\n */\nfunction checkAchievements() {\n  const readIds = Object.keys(state.read);\n  const newlyUnlocked = [];\n\n  function unlock(id) {\n    if (!state.achievements[id]) {\n      state.achievements[id] = new Date().toISOString();\n      newlyUnlocked.push(ACHIEVEMENTS.find(a => a.id === id));\n    }\n  }\n\n  if (readIds.length >= 1) unlock('first-read');\n  if (readIds.length >= 3) unlock('three-read');\n  if (readIds.length >= PASSAGES.length) unlock('all-read');\n\n  if (state.triedFonts.includes('opendys')) unlock('tried-opendys');\n  if (state.triedContrasts.includes('dark')) unlock('tried-dark');\n  if (state.triedContrasts.includes('soft')) unlock('tried-soft');\n  if (state.triedContrasts.includes('high')) unlock('tried-high');\n\n  if (state.usedAudioOnce) unlock('used-audio');\n  if (state.minPace <= 0.7) unlock('slow-pace');\n\n  // Categories read\n  const catsRead = new Set();\n  readIds.forEach(id => {\n    const p = PASSAGES.find(x => x.id === id);\n    if (p) catsRead.add(p.cat);\n  });\n  if (catsRead.size >= 3) unlock('all-cats');\n\n  if (newlyUnlocked.length) {\n    saveState();\n    newlyUnlocked.forEach((a, i) => setTimeout(() => showToast(a), i * 600));\n  }\n}\n\nlet toastTimer = null;\nfunction showToast(achievement) {\n  const t = document.getElementById('toast');\n  document.getElementById('toastIcon').textContent = achievement.icon;\n  document.getElementById('toastTitle').textContent = achievement.title;\n  t.classList.add('show');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => t.classList.remove('show'), 3600);\n}\n\n/* =========================================================================\n   VOICE CUES\n   ========================================================================= */\nlet lastVoiceUtterance = null;\nfunction speakCue(text) {\n  if (!state.voiceCues || !('speechSynthesis' in window)) return;\n  if (speaking) return; // don't interrupt a passage being read aloud\n  speechSynthesis.cancel();\n  const u = new SpeechSynthesisUtterance(text);\n  u.rate = 1.0;\n  u.lang = 'en-US';\n  lastVoiceUtterance = u;\n  speechSynthesis.speak(u);\n}\n\n// Attach voice cue listeners to all data-voice elements (focus + brief hover delay)\nfunction wireVoiceCues() {\n  document.querySelectorAll('[data-voice]').forEach(el => {\n    el.addEventListener('focus', () => speakCue(el.dataset.voice));\n    let hoverTimer = null;\n    el.addEventListener('mouseenter', () => {\n      if (!state.voiceCues) return;\n      hoverTimer = setTimeout(() => speakCue(el.dataset.voice), 350);\n    });\n    el.addEventListener('mouseleave', () => {\n      if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }\n    });\n  });\n}\n\n/* =========================================================================\n   MOBILE NAV\n   ========================================================================= */\nconst navToggle = document.getElementById('navToggle');\nconst navLinks = document.getElementById('primaryNav');\nif (navToggle && navLinks) {\n  navToggle.addEventListener('click', () => {\n    const open = navLinks.classList.toggle('open');\n    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');\n  });\n}\n\n/* =========================================================================\n   FILTERS \u2014 Language / Learning needs / Grade. Cosmetic but functional UI.\n   The current library is English-only so language and grade filters update\n   the result count and copy without removing cards; learning-needs chips map\n   to specific accessibility suggestions in the result text.\n   ========================================================================= */\nconst filterState = {\n  lang: new Set(['english']),\n  need: new Set(),\n  grade: new Set(['6']),\n};\n\nconst LANG_LABELS = { english: 'English', hindi: 'Hindi', bengali: 'Bengali', marathi: 'Marathi', gujarati: 'Gujarati', telugu: 'Telugu' };\nconst NEED_SUGGESTIONS = {\n  dyslexia: 'Try OpenDyslexic font and turn on read-aloud.',\n  adhd: 'Try Reduced or No motion, and High contrast for fewer visual distractions.',\n  autism: 'Try the warm cream or dark theme. Turn off audio if it adds to the load.',\n  speech: 'Read-aloud is on by default \u2014 no spoken response required from the reader.',\n  visual: 'Increase text size to Large or Extra Large; try the high-contrast theme.',\n};\n\nfunction syncFilterUI() {\n  document.querySelectorAll('[data-filter]').forEach(btn => {\n    const f = btn.dataset.filter, v = btn.dataset.val;\n    let active;\n    if (f === 'lang') { const m = window.SAKSHAM_LANGS.find(x => x.code === v); active = !!m && m.key === state.lang; }\n    else active = filterState[f].has(v);\n    btn.setAttribute('aria-pressed', active ? 'true' : 'false');\n  });\n  const langMeta = window.SAKSHAM_LANGS.find(x => x.key === state.lang) || window.SAKSHAM_LANGS[0];\n  const grades = [...filterState.grade].sort((a, b) => a - b).join(', ');\n  const visible = PASSAGES.filter(passesFilters).length;\n  let line = t('filter_result', { lang: langMeta.native, g: grades || '\u2014', n: visible, total: PASSAGES.length });\n  const needs = [...filterState.need];\n  if (needs.length) line += ' ' + t('sug_prefix') + needs.map(n => t('sug_' + n)).join(' ');\n  document.getElementById('filterResult').textContent = line;\n  const hint = document.getElementById('filterHint');\n  const total = filterState.need.size + filterState.grade.size;\n  hint.textContent = total > 1 ? t('filters_active', { n: total }) : t('filter_hint');\n}\n\ndocument.querySelectorAll('[data-filter]').forEach(btn => {\n  btn.addEventListener('click', () => {\n    const f = btn.dataset.filter, v = btn.dataset.val;\n    if (f === 'lang') {\n      // Language is single-select and switches the whole app immediately.\n      const meta = window.SAKSHAM_LANGS.find(x => x.code === v);\n      if (meta) {\n        state.lang = meta.key;\n        filterState.lang = new Set([v]);\n        saveState();\n        applyLang();\n      }\n      return;\n    }\n    if (f === 'grade') { filterState.grade = new Set([v]); }   // grade is single-select\n    else { if (filterState[f].has(v)) filterState[f].delete(v); else filterState[f].add(v); }\n    syncFilterUI();\n    renderLibrary();\n  });\n});\ndocument.getElementById('filterClear').addEventListener('click', () => {\n  filterState.need = new Set();\n  filterState.grade = new Set(['6']);\n  syncFilterUI();\n  renderLibrary();\n});\ndocument.getElementById('filterApply').addEventListener('click', () => {\n  document.getElementById('filterPanel').open = false;\n  renderLibrary();\n  document.getElementById('library').scrollIntoView({ behavior: state.motion === 'none' ? 'auto' : 'smooth' });\n});\n\nsyncFilterUI();\n\n/* =========================================================================\n   INIT\n   ========================================================================= */\nsyncPrefsUI();\n\n// Initialise language selection from saved state, then localise the whole UI.\n(function initLang() {\n  const meta = window.SAKSHAM_LANGS.find(x => x.key === state.lang) || window.SAKSHAM_LANGS[0];\n  filterState.lang = new Set([meta.code]);\n})();\napplyLang();\n\n// Some browsers load speech voices asynchronously; re-evaluate when they arrive.\nif ('speechSynthesis' in window) {\n  speechSynthesis.onvoiceschanged = () => {};\n}\n\n// Route to setup if no profile yet, otherwise home\nif (!state.profile || !state.profile.name) {\n  showScreen('setup');\n} else {\n  showScreen('home');\n}\n\n// Wire voice cues after DOM is set up\nwireVoiceCues();\n\n// Check achievements on load (in case data exists but they were never computed)\ncheckAchievements();\n<\/script>\n\n\n<script>\n(function () {\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if (!a) return;\n    e.preventDefault();\n    parent.postMessage({ saksham: 'go', page: a.getAttribute('href') }, '*');\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "achievements.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>Achievements \u2014 Saksham<\/title>\n<meta name=\"description\" content=\"Your personal milestones. No comparison, no leaderboards, no ranks \u2014 only your own reading journey.\" />\n<style>/*__CSS__*/<\/style>\n<\/head>\n\n<body data-contrast=\"cream\" data-font=\"atkinson\" data-size=\"m\" data-motion=\"full\">\n\n<a href=\"#main\" class=\"skip\">Skip to main content<\/a>\n\n<header class=\"site-nav\" role=\"banner\">\n  <div class=\"nav-inner\">\n    <a href=\"index.html\" class=\"brand\" aria-label=\"Saksham home\">\n      <span class=\"brand-mark\" aria-hidden=\"true\">\u0938<\/span>\n      <span>Saksham<\/span>\n    <\/a>\n    <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"primaryNav\" id=\"navToggle\">\u2630 Menu<\/button>\n    <nav class=\"nav-links\" id=\"primaryNav\" aria-label=\"Primary\">\n      <a href=\"index.html\">Library<\/a>\n      <a href=\"achievements.html\" class=\"current\">Achievements<\/a>\n      <a href=\"educators.html\">For educators<\/a>\n      <a href=\"about.html\">About<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\" tabindex=\"-1\">\n\n  <div class=\"page-intro\">\n    <div class=\"container\">\n      <h1>Your milestones<\/h1>\n      <p class=\"lede\">Small markers of your own reading journey. There's no leaderboard, no comparison, and no one else can see these. Some unlock when you read; some unlock when you try a new setting that might help you.<\/p>\n      <div class=\"hero-books intro-books\" aria-hidden=\"true\"><span style=\"height:52px;background:#3D5CFF;\"><\/span><span style=\"height:44px;background:#FF7C24;\"><\/span><span style=\"height:56px;background:#2F8F6E;\"><\/span><span style=\"height:40px;background:#E66B8E;\"><\/span><span style=\"height:50px;background:#FFB400;\"><\/span><span style=\"height:46px;background:#6E45B5;\"><\/span><span style=\"height:38px;background:#3D5CFF;\"><\/span><span style=\"height:54px;background:#2F8F6E;\"><\/span><span style=\"height:48px;background:#FF7C24;\"><\/span><span style=\"height:42px;background:#9B7BC9;\"><\/span><span style=\"height:50px;background:#E66B8E;\"><\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"container\">\n    <div id=\"summary\" class=\"panel\"><\/div>\n\n    <div class=\"badge-grid\" id=\"badgeGrid\" role=\"list\"><\/div>\n\n    <p style=\"margin: 2rem 0; text-align: center;\">\n      <a href=\"index.html\" class=\"btn ghost\">\u2190 Back to the library<\/a>\n    <\/p>\n  <\/div>\n\n<\/main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div>Saksham \u2014 capable learning, your way.<\/div>\n    <div class=\"footer-links\">\n      <a href=\"achievements.html\">Achievements<\/a>\n      <a href=\"educators.html\">For educators<\/a>\n      <a href=\"about.html\">About<\/a>\n      <a href=\"https://github.com/jsayed23/miniproject2\" target=\"_blank\" rel=\"noopener\">Source<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n/* Apply saved preferences across the whole site */\nlet state = { font: 'atkinson', size: 'm', contrast: 'cream', motion: 'full', read: {}, achievements: {}, triedFonts: ['atkinson'], triedContrasts: ['cream'], usedAudioOnce: false, minPace: 0.9 };\ntry {\n  const raw = localStorage.getItem('saksham:v3') || localStorage.getItem('saksham:v2');\n  if (raw) {\n    const s = JSON.parse(raw);\n    Object.assign(state, s);\n    state.read = s.read || {};\n    state.achievements = s.achievements || {};\n    state.triedFonts = s.triedFonts || ['atkinson'];\n    state.triedContrasts = s.triedContrasts || ['cream'];\n  }\n} catch (e) {}\ndocument.body.dataset.font = state.font;\ndocument.body.dataset.size = state.size;\ndocument.body.dataset.contrast = state.contrast;\ndocument.body.dataset.motion = state.motion;\n\nconst ACHIEVEMENTS = [\n  { id: 'first-read',     icon: '\ud83d\udcd6', title: 'First passage',     desc: 'You read your first passage. Welcome to the library.' },\n  { id: 'three-read',     icon: '\ud83d\udcda', title: 'Three down',        desc: 'Three passages read. That counts as a habit.' },\n  { id: 'all-read',       icon: '\ud83c\udf93', title: 'The whole library', desc: 'You read every passage. Done your way.' },\n  { id: 'tried-opendys',  icon: '\ud83c\udd70\ufe0f', title: 'Letter explorer',  desc: 'You tried the OpenDyslexic font.' },\n  { id: 'tried-dark',     icon: '\ud83c\udf19', title: 'Night reader',      desc: 'You tried the dark theme.' },\n  { id: 'tried-soft',     icon: '\ud83c\udf27', title: 'Calm reader',       desc: 'You tried the soft blue theme.' },\n  { id: 'tried-high',     icon: '\u2728', title: 'Maximum contrast',  desc: 'You tried the high-contrast theme.' },\n  { id: 'used-audio',     icon: '\ud83d\udd0a', title: 'Read along',        desc: 'You used read-aloud while reading.' },\n  { id: 'slow-pace',      icon: '\ud83d\udc22', title: 'Slow and steady',   desc: 'You read at 0.7\u00d7 or slower. Patient with yourself.' },\n  { id: 'all-cats',       icon: '\ud83d\uddfa',  title: 'Curious mind',     desc: 'You read from all three categories.' }\n];\n\nconst unlockedCount = Object.keys(state.achievements).length;\nconst total = ACHIEVEMENTS.length;\n\ndocument.getElementById('summary').innerHTML = `\n  <p style=\"margin: 0;\"><strong>${unlockedCount} of ${total}<\/strong> milestones reached.\n  ${unlockedCount === 0 ? \"Open a passage, try a new font or theme, and the first one will appear here.\" :\n    unlockedCount < total ? \"Keep going at your own pace. The rest will arrive when you're ready.\" :\n    \"You've reached every milestone in this build. Thank you for trying Saksham.\"}<\/p>\n`;\n\nconst grid = document.getElementById('badgeGrid');\ngrid.innerHTML = ACHIEVEMENTS.map(a => {\n  const unlockedAt = state.achievements[a.id];\n  const unlocked = !!unlockedAt;\n  const when = unlocked ? new Date(unlockedAt).toLocaleDateString() : '';\n  return `\n    <div class=\"badge ${unlocked ? 'unlocked' : 'locked'}\" role=\"listitem\">\n      <div class=\"badge-icon\" aria-hidden=\"true\">${a.icon}<\/div>\n      <div>\n        <h3>${a.title}<\/h3>\n        <p>${a.desc}<\/p>\n        ${unlocked ? `<span class=\"when\">Unlocked ${when}<\/span>` : ''}\n      <\/div>\n    <\/div>\n  `;\n}).join('');\n\n// Mobile nav\nconst navToggle = document.getElementById('navToggle');\nconst navLinks = document.getElementById('primaryNav');\nif (navToggle && navLinks) {\n  navToggle.addEventListener('click', () => {\n    const open = navLinks.classList.toggle('open');\n    navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');\n  });\n}\n<\/script>\n\n\n<script>\n(function () {\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if (!a) return;\n    e.preventDefault();\n    parent.postMessage({ saksham: 'go', page: a.getAttribute('href') }, '*');\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "educators.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>For educators \u2014 Saksham<\/title>\n<meta name=\"description\" content=\"How to use Saksham with neurodivergent students. Quick start, classroom routine, differentiation guide, and privacy notes \u2014 written for teachers who already have too much to do.\" />\n<style>/*__CSS__*/<\/style>\n<\/head>\n\n<body data-contrast=\"cream\" data-font=\"atkinson\" data-size=\"m\" data-motion=\"full\">\n\n<a href=\"#main\" class=\"skip\">Skip to main content<\/a>\n\n<header class=\"site-nav\" role=\"banner\">\n  <div class=\"nav-inner\">\n    <a href=\"index.html\" class=\"brand\" aria-label=\"Saksham home\">\n      <span class=\"brand-mark\" aria-hidden=\"true\">\u0938<\/span>\n      <span>Saksham<\/span>\n    <\/a>\n    <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"primaryNav\" id=\"navToggle\">\u2630 Menu<\/button>\n    <nav class=\"nav-links\" id=\"primaryNav\" aria-label=\"Primary\">\n      <a href=\"index.html\">Library<\/a>\n      <a href=\"achievements.html\">Achievements<\/a>\n      <a href=\"educators.html\" class=\"current\">For educators<\/a>\n      <a href=\"about.html\">About<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\" tabindex=\"-1\">\n\n  <div class=\"page-intro\">\n    <div class=\"container\">\n      <h1>For educators<\/h1>\n      <p class=\"lede\">Saksham is a small reading library that students can configure to their own brain \u2014 font, contrast, pace, motion, and audio \u2014 before they begin. This page is the dashboard you'd see for a class using it, plus everything you need to use it yourself.<\/p>\n      <div class=\"hero-books intro-books\" aria-hidden=\"true\"><span style=\"height:52px;background:#3D5CFF;\"><\/span><span style=\"height:44px;background:#FF7C24;\"><\/span><span style=\"height:56px;background:#2F8F6E;\"><\/span><span style=\"height:40px;background:#E66B8E;\"><\/span><span style=\"height:50px;background:#FFB400;\"><\/span><span style=\"height:46px;background:#6E45B5;\"><\/span><span style=\"height:38px;background:#3D5CFF;\"><\/span><span style=\"height:54px;background:#2F8F6E;\"><\/span><span style=\"height:48px;background:#FF7C24;\"><\/span><span style=\"height:42px;background:#9B7BC9;\"><\/span><span style=\"height:50px;background:#E66B8E;\"><\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- TEACHER DASHBOARD (mock class data demonstrating the differentiation Saksham enables) -->\n  <div class=\"container\">\n    <div class=\"teacher-panel\">\n      <div class=\"head\">\n        <h2>Class dashboard<\/h2>\n        <span class=\"class-meta\">Grade 6 \u00b7 Section B \u00b7 6 students using Saksham today<\/span>\n      <\/div>\n      <div class=\"demo-note\">\n        <strong>This is a demonstration with mock data.<\/strong> The real Saksham doesn't track students or upload any data. A teacher's view in practice would show what students choose to share on a shared classroom device \u2014 not surveillance. The columns below illustrate the kinds of differentiation Saksham reveals.\n      <\/div>\n\n      <table class=\"roster\" aria-label=\"Class reading dashboard\">\n        <thead>\n          <tr>\n            <th scope=\"col\">Student<\/th>\n            <th scope=\"col\">Their settings<\/th>\n            <th scope=\"col\">Passages<\/th>\n            <th scope=\"col\">Notes for you<\/th>\n          <\/tr>\n        <\/thead>\n        <tbody>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-blue\" aria-hidden=\"true\">\ud83e\udd8a<\/span>Aarav<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag accent\">OpenDyslexic<\/span>\n              <span class=\"tag\">Pace 0.7\u00d7<\/span>\n              <span class=\"tag warm\">Audio on<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 75%\"><\/span><\/span> 6 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">Reads slower, uses audio sync. Doing well at his own pace.<\/td>\n          <\/tr>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-warm\" aria-hidden=\"true\">\ud83e\udd8b<\/span>Priya<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag\">Atkinson \u00b7 XL<\/span>\n              <span class=\"tag accent\">High contrast<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 50%\"><\/span><\/span> 4 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">Visual sensitivity. Switched to high contrast on her own \u2014 leave it.<\/td>\n          <\/tr>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-green\" aria-hidden=\"true\">\ud83d\udc22<\/span>Dhruv<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag\">Lexend<\/span>\n              <span class=\"tag\">Motion: Reduced<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 25%\"><\/span><\/span> 2 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">ADHD. Reduced motion helps with overstimulation. Two passages in one sitting is a win.<\/td>\n          <\/tr>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-lav\" aria-hidden=\"true\">\ud83e\udd89<\/span>Meera<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag\">Atkinson<\/span>\n              <span class=\"tag accent\">Dark theme<\/span>\n              <span class=\"tag warm\">Audio on<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 100%\"><\/span><\/span> 8 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">Finished the library. Ask if she'd like to suggest the next passages.<\/td>\n          <\/tr>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-rose\" aria-hidden=\"true\">\ud83d\udc3c<\/span>Kabir<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag accent\">OpenDyslexic \u00b7 L<\/span>\n              <span class=\"tag\">Voice cues on<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 12.5%\"><\/span><\/span> 1 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">Emerging reader. Voice cues are helping him navigate the interface.<\/td>\n          <\/tr>\n          <tr>\n            <td data-lbl=\"Student\">\n              <div class=\"student\"><span class=\"avatar av-sun\" aria-hidden=\"true\">\ud83d\udc1d<\/span>Sara<\/div>\n            <\/td>\n            <td data-lbl=\"Settings\">\n              <span class=\"tag\">Atkinson \u00b7 M<\/span>\n              <span class=\"tag\">Pace 1.2\u00d7<\/span>\n            <\/td>\n            <td data-lbl=\"Read\">\n              <span class=\"progress-bar\"><span class=\"fill\" style=\"width: 62.5%\"><\/span><\/span> 5 / 8\n            <\/td>\n            <td data-lbl=\"Notes\">No diagnosed need. Just likes the calm interface. Reads above grade level.<\/td>\n          <\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n  <\/div>\n\n  <div class=\"container\">\n    <div class=\"prose\">\n\n      <h2>The fastest possible start<\/h2>\n      <ol>\n        <li>Open <a href=\"index.html\">the library<\/a> on any device with a modern browser.<\/li>\n        <li>Hand it to the student.<\/li>\n        <li>Tell them: <em>\"Change the font and the colors until reading feels okay. Then pick a passage.\"<\/em><\/li>\n      <\/ol>\n      <p>That's it. No accounts, no install, no signup, no data collection. Their settings save on the device they use.<\/p>\n\n      <h2>What's actually in the library<\/h2>\n      <p>Eight short passages \u2014 about three to four minutes each \u2014 organized into three categories: Stories, Science, and Sky &amp; stars. Reading level is \"Easy\" or \"Medium.\" All eight are appropriate for roughly 10\u201316 year olds. Several are set in Indian contexts (Mumbai, banyan trees, taal music, nakshatras) \u2014 chosen because the original research interviews were with Indian educators and families.<\/p>\n\n      <h2>A 30-minute classroom routine<\/h2>\n      <ol>\n        <li><strong>Minutes 0\u20135.<\/strong> Let students set up their preferences. Tell them they can change anything later, and that the settings save automatically. Resist the urge to choose for them \u2014 this <em>is<\/em> the lesson.<\/li>\n        <li><strong>Minutes 5\u201320.<\/strong> Each student picks one passage and reads it. Audio is optional. They can change settings mid-passage. Your job is to be available for questions, not to monitor pace.<\/li>\n        <li><strong>Minutes 20\u201330.<\/strong> If you want a writing or discussion follow-up, ask one prompt per passage. For example: <em>\"What's one thing you remember from the banyan tree?\"<\/em> or <em>\"What did the lamp lighter teach his granddaughter without saying it?\"<\/em><\/li>\n      <\/ol>\n\n      <h2>How to differentiate without building scaffolds<\/h2>\n      <p>Each setting in Saksham covers a kind of differentiation you would otherwise be doing manually:<\/p>\n      <ul>\n        <li><strong>Students with dyslexia<\/strong> can switch to OpenDyslexic font and turn on read-aloud. The current word will be highlighted as it's spoken.<\/li>\n        <li><strong>Students with ADHD<\/strong> can turn motion to \"Reduced\" or \"None\" to remove transitions, and switch to high-contrast theme to reduce visual noise.<\/li>\n        <li><strong>Students with autism<\/strong> who shut down at bright screens can switch to warm cream or dark theme.<\/li>\n        <li><strong>Students with low vision<\/strong> can use the Atkinson Hyperlegible font at Large or Extra Large size.<\/li>\n        <li><strong>Students who are still emerging readers<\/strong> can read alongside audio at a slower pace (0.5\u20130.7\u00d7) and see each word highlight in real time.<\/li>\n      <\/ul>\n      <p>You don't need to know which student needs which. They figure it out. That's the design.<\/p>\n\n      <h2>Privacy<\/h2>\n      <div class=\"panel\">\n        <p><strong>No data leaves the device.<\/strong> Saksham does not have a backend, an account system, or any analytics. All settings and progress are stored in the student's browser using <code>localStorage<\/code>. You can verify this yourself by opening the browser's network tab \u2014 nothing is uploaded.<\/p>\n        <p>This matters in school contexts. You can hand Saksham to a minor without parental consent forms because there is no data to consent to share.<\/p>\n      <\/div>\n\n      <h2>What Saksham is not<\/h2>\n      <ul>\n        <li>It is <em>not<\/em> a curriculum. It is a calm reading surface.<\/li>\n        <li>It is <em>not<\/em> a measurement tool. There are no scores, no time-on-task, no comparison to other students. By design.<\/li>\n        <li>It is <em>not<\/em> a replacement for an accessibility specialist. It just removes one small piece of improvisation from your day.<\/li>\n      <\/ul>\n\n      <h2>The conversation behind the app<\/h2>\n      <blockquote>\n        I have 40 students and no tools designed for differentiated instruction. I'm constantly improvising.\n        <cite>\u2014 Meera, inclusive classroom teacher, from the original Saksham research interviews<\/cite>\n      <\/blockquote>\n      <p>If you are Meera or know someone like her, this is built for you. The published research that this app implements is in the <a href=\"https://issuu.com/calpolytaga/docs/cal_poly_taga_2026/132\" target=\"_blank\" rel=\"noopener\">Cal Poly TAGA 2026 Journal<\/a>.<\/p>\n\n      <h2>Suggestions, problems, ideas<\/h2>\n      <p>If you actually use this with students, I'd really like to hear how it went. Email <a href=\"mailto:sayedjasmine@gmail.com\">sayedjasmine@gmail.com<\/a> \u2014 especially if there's a passage you wish were there, or a setting that didn't work the way you needed.<\/p>\n\n      <hr class=\"divider\">\n      <p><a href=\"index.html\">\u2190 Back to the library<\/a><\/p>\n\n    <\/div>\n  <\/div>\n\n<\/main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div>Saksham \u2014 capable learning, your way.<\/div>\n    <div class=\"footer-links\">\n      <a href=\"achievements.html\">Achievements<\/a>\n      <a href=\"educators.html\">For educators<\/a>\n      <a href=\"about.html\">About<\/a>\n      <a href=\"https://github.com/jsayed23/miniproject2\" target=\"_blank\" rel=\"noopener\">Source<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n  // Apply saved preferences across the whole site\n  try {\n    const raw = localStorage.getItem('saksham:v2');\n    if (raw) {\n      const s = JSON.parse(raw);\n      if (s.font) document.body.dataset.font = s.font;\n      if (s.size) document.body.dataset.size = s.size;\n      if (s.contrast) document.body.dataset.contrast = s.contrast;\n      if (s.motion) document.body.dataset.motion = s.motion;\n    }\n  } catch (e) {}\n\n  // Mobile nav\n  const navToggle = document.getElementById('navToggle');\n  const navLinks = document.getElementById('primaryNav');\n  if (navToggle && navLinks) {\n    navToggle.addEventListener('click', () => {\n      const open = navLinks.classList.toggle('open');\n      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');\n    });\n  }\n<\/script>\n\n<script>\n(function () {\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if (!a) return;\n    e.preventDefault();\n    parent.postMessage({ saksham: 'go', page: a.getAttribute('href') }, '*');\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n", "about.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>About \u2014 Saksham<\/title>\n<meta name=\"description\" content=\"Saksham means capable in Hindi. A brief account of what this is, why it exists, and how it's built.\" />\n<style>/*__CSS__*/<\/style>\n<\/head>\n\n<body data-contrast=\"cream\" data-font=\"lexend\" data-size=\"m\" data-motion=\"full\">\n\n<a href=\"#main\" class=\"skip\">Skip to main content<\/a>\n\n<header class=\"site-nav\" role=\"banner\">\n  <div class=\"nav-inner\">\n    <a href=\"index.html\" class=\"brand\" aria-label=\"Saksham home\">\n      <span class=\"brand-mark\" aria-hidden=\"true\">\u0938<\/span>\n      <span>Saksham<\/span>\n    <\/a>\n    <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"primaryNav\" id=\"navToggle\">\u2630 Menu<\/button>\n    <nav class=\"nav-links\" id=\"primaryNav\" aria-label=\"Primary\">\n      <a href=\"index.html\">Library<\/a>\n      <a href=\"achievements.html\">Achievements<\/a>\n      <a href=\"educators.html\">For educators<\/a>\n      <a href=\"about.html\" class=\"current\">About<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\" tabindex=\"-1\">\n\n  <div class=\"page-intro\">\n    <div class=\"container\">\n      <div class=\"intro-row\">\n        <div class=\"intro-text\">\n          <h1>About Saksham<\/h1>\n          <p class=\"lede\"><em>Saksham<\/em> means <em>capable<\/em> in Hindi. The app is a small reading library built around the idea that the most important interaction a neurodivergent reader has with a tool is the moment they realize the tool will change to fit them.<\/p>\n        <\/div>\n        <div class=\"intro-visual\" aria-hidden=\"true\">\n          <div class=\"intro-orb\"><span class=\"intro-emoji\">\ud83d\udcd6<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"container\">\n    <div class=\"prose\">\n\n      <h2>What this is<\/h2>\n      <p>A reading library of eight short passages, with a settings panel that lets the reader choose font, text size, contrast theme, reading pace, motion level, and whether to hear the words read aloud. When read-aloud is on, the current word is highlighted in sync with the spoken voice. Settings save in the browser. Nothing is uploaded, no account is needed, and no progress is shared.<\/p>\n\n      <h2>Why it exists<\/h2>\n      <p>This site is the working implementation of a 2024\u20132025 research project I authored at Cal Poly: <em>Designing for Neurodiversity: Accessibility in Educational Technology for India's Future Learners.<\/em> The paper was published in the <a href=\"https://issuu.com/calpolytaga/docs/cal_poly_taga_2026/132\" target=\"_blank\" rel=\"noopener\">Cal Poly TAGA 2026 Journal<\/a>. The full case study lives on <a href=\"https://jasminesayedportfolio.com/saksham.html\" target=\"_blank\" rel=\"noopener\">my portfolio<\/a>; the original Figma prototype is <a href=\"https://www.figma.com/proto/vOScugmTaA0yo2M25I105V/Saksham-App-Design-File?content-scaling=fixed&kind=proto&node-id=2-12798&page-id=0%3A1&scaling=scale-down\" target=\"_blank\" rel=\"noopener\">here<\/a>.<\/p>\n\n      <p>The research came out of interviews with educators and parents of neurodivergent children in India. Four findings shaped this build:<\/p>\n      <ul>\n        <li><strong>Sensory overwhelm is access, not preference.<\/strong> Warm cream is the default. No autoplay, no notifications, no animation that the reader didn't ask for. Motion can be turned off entirely.<\/li>\n        <li><strong>One modality isn't enough.<\/strong> Read-aloud is word-synchronized \u2014 not just narration. The current word is visually highlighted as it's spoken.<\/li>\n        <li><strong>Control transforms anxiety into confidence.<\/strong> Settings are not buried in a menu. They sit at the top of the library, open by default for first-time visitors.<\/li>\n        <li><strong>Comparison kills motivation.<\/strong> There are no streaks, no scores, no leaderboards. The progress note counts only the reader's own work.<\/li>\n      <\/ul>\n\n      <h2>How it's built<\/h2>\n      <p>Plain HTML, CSS, and JavaScript. No framework, no build step, no backend. Fonts load from CDN (Atkinson Hyperlegible, Lexend, and Nunito from Google Fonts; OpenDyslexic from cdnfonts). All preferences and progress sit in <code>localStorage<\/code>. Read-aloud uses the browser's built-in Web Speech API; the word-level highlight is driven by the <code>boundary<\/code> event.<\/p>\n\n      <div class=\"panel\">\n        <p><strong>Privacy claim, verifiable.<\/strong> Saksham has no analytics, no telemetry, no tracking, and no server. You can prove this by opening your browser's network tab and watching what happens when you use the app: only the static files and the fonts load. Nothing else.<\/p>\n      <\/div>\n\n      <h2>Course context<\/h2>\n      <p>The browser implementation was built for HCDE 530 (Computational Methods in Human Centered Design and Engineering) at the University of Washington, Spring 2026, as the Mini Project 2 final submission. The competency claim is in the repo as <code>mp2.md<\/code>; the reflection is in <code>reflection.md<\/code>.<\/p>\n\n      <h2>Author<\/h2>\n      <p>Jasmine Sayed. UX designer and researcher. <a href=\"https://jasminesayedportfolio.com\" target=\"_blank\" rel=\"noopener\">Portfolio<\/a> \u00b7 <a href=\"https://www.linkedin.com/in/sayedjasmine\" target=\"_blank\" rel=\"noopener\">LinkedIn<\/a> \u00b7 <a href=\"mailto:sayedjasmine@gmail.com\">sayedjasmine@gmail.com<\/a><\/p>\n\n      <hr class=\"divider\">\n      <p><a href=\"index.html\">\u2190 Back to the library<\/a><\/p>\n\n    <\/div>\n  <\/div>\n\n<\/main>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div>Saksham \u2014 capable learning, your way.<\/div>\n    <div class=\"footer-links\">\n      <a href=\"achievements.html\">Achievements<\/a>\n      <a href=\"educators.html\">For educators<\/a>\n      <a href=\"about.html\">About<\/a>\n      <a href=\"https://github.com/jsayed23/miniproject2\" target=\"_blank\" rel=\"noopener\">Source<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n  // Apply saved preferences across the whole site\n  try {\n    const raw = localStorage.getItem('saksham:v2');\n    if (raw) {\n      const s = JSON.parse(raw);\n      if (s.font) document.body.dataset.font = s.font;\n      if (s.size) document.body.dataset.size = s.size;\n      if (s.contrast) document.body.dataset.contrast = s.contrast;\n      if (s.motion) document.body.dataset.motion = s.motion;\n    }\n  } catch (e) {}\n\n  const navToggle = document.getElementById('navToggle');\n  const navLinks = document.getElementById('primaryNav');\n  if (navToggle && navLinks) {\n    navToggle.addEventListener('click', () => {\n      const open = navLinks.classList.toggle('open');\n      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');\n    });\n  }\n<\/script>\n\n<script>\n(function () {\n  document.addEventListener('click', function (e) {\n    var a = e.target.closest && e.target.closest('a[href$=\".html\"]');\n    if (!a) return;\n    e.preventDefault();\n    parent.postMessage({ saksham: 'go', page: a.getAttribute('href') }, '*');\n  }, true);\n})();\n<\/script>\n<\/body>\n<\/html>\n"};
