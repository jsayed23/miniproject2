play: grid; place-items: center; padding: clamp(2.5rem, 6vw, 4.5rem) 0; }\n.complete-card {\n  width: 100%;\n  max-width: 36rem;\n  margin-inline: auto;\n  text-align: center;\n  padding: clamp(1.75rem, 4vw, 2.75rem);\n  background: var(--bg-card);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow-lg);\n}\n.complete-icon {\n  display: grid; place-items: center;\n  width: 5rem; height: 5rem;\n  margin: 0 auto 1.25rem;\n  border-radius: 50%;\n  background: var(--ok-soft);\n  color: var(--ok);\n  font-size: 2.25rem;\n  animation: pop calc(0.5s * var(--motion-scale)) cubic-bezier(0.34, 1.56, 0.64, 1) both;\n}\n@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }\n/* The title carries a passage name, so it needs to stay calm at 3\u20137 words. */\n.complete-card h1 { font-size: clamp(1.5rem, 1.15rem + 1.4vw, 2rem); }\n.complete-sub { color: var(--ink-soft); }\n.saved-line { font-size: 0.88rem; color: var(--ink-faint); }\n\n.next-suggest { margin-top: 1.75rem; text-align: left; }\n.next-suggest h2 { font-size: 1rem; color: var(--ink-soft); margin-bottom: 0.6rem; }\n.next-card {\n  display: block;\n  width: 100%;\n  text-align: left;\n  padding: 1.15rem 1.25rem;\n  background: var(--bg-soft);\n  border: 2px solid var(--line);\n  border-radius: var(--r-lg);\n  cursor: pointer;\n  font: inherit; color: var(--ink);\n  transition: all calc(0.18s * var(--motion-scale)) ease;\n}\n.next-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow); }\n.next-card .meta {\n  font-family: var(--font-brand); font-weight: 800;\n  font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;\n  color: var(--accent); margin-bottom: 0.35rem;\n}\n.next-card h3 { margin: 0 0 0.3rem; }\n.next-card p { margin: 0; font-size: 0.9rem; color: var(--ink-soft); }\n.all-done { margin-top: 1.5rem; padding: 1.25rem; background: var(--ok-soft); border-radius: var(--r-lg); }\n.complete-actions { display: flex; flex-wrap: wrap; gap: 0.7rem; justify-content: center; margin-top: 1.75rem; }\n\n\n/* ==========================================================================\n   12. ACHIEVEMENTS\n   ========================================================================== */\n\n.page-intro {\n  padding: clamp(2.5rem, 5vw, 4rem) 0 clamp(2rem, 4vw, 3rem);\n  background:\n    radial-gradient(46rem 22rem at 10% 0%, var(--accent-soft), transparent 62%),\n    radial-gradient(32rem 20rem at 92% 8%, var(--c-warm-soft), transparent 60%);\n  border-bottom: 1px solid var(--line);\n  margin-bottom: 2.5rem;\n}\n.page-intro h1 { margin-bottom: 0.75rem; }\n\n/* Book-spine strip used as a decorative rule under page intros */\n.hero-books, .intro-books {\n  display: flex; align-items: flex-end; gap: 4px;\n  margin-top: 1.75rem;\n  height: 3.5rem;\n}\n.hero-books span, .intro-books span {\n  display: block;\n  width: 0.85rem;\n  border-radius: 3px 3px 0 0;\n  opacity: 0.9;\n}\nbody[data-contrast=\"high\"] .hero-books span,\nbody[data-contrast=\"high\"] .intro-books span { background: var(--accent) !important; }\n\n.panel {\n  padding: 1.15rem 1.35rem;\n  background: var(--bg-card);\n  border: 1px solid var(--line);\n  border-left: 5px solid var(--accent);\n  border-radius: var(--r);\n  box-shadow: var(--shadow-sm);\n  margin-bottom: 2rem;\n}\n\n.badge-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));\n  gap: 1rem;\n  margin-bottom: 2.5rem;\n}\n.badge {\n  display: flex;\n  gap: 1rem;\n  align-items: flex-start;\n  padding: 1.25rem;\n  background: var(--bg-card);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-sm);\n  transition: transform calc(0.18s * var(--motion-scale)) ease;\n}\n.badge h3 { margin: 0 0 0.25rem; font-size: 1rem; }\n.badge p { margin: 0; font-size: 0.88rem; color: var(--ink-soft); line-height: 1.5; }\n.badge-icon {\n  display: grid; place-items: center;\n  width: 3.25rem; height: 3.25rem;\n  border-radius: 50%;\n  font-size: 1.55rem;\n  flex: none;\n  background: var(--bg-sunk);\n  border: 2px solid var(--line);\n}\n.badge.locked { opacity: 0.62; }\n.badge.locked .badge-icon { filter: grayscale(1); }\n.badge.unlocked {\n  border-color: color-mix(in srgb, var(--c-sun) 65%, var(--line));\n  background: linear-gradient(180deg, color-mix(in srgb, var(--c-sun) 12%, var(--bg-card)), var(--bg-card));\n}\n.badge.unlocked:hover { transform: translateY(-3px); }\n.badge.unlocked .badge-icon {\n  background: color-mix(in srgb, var(--c-sun) 28%, var(--bg-card));\n  border-color: color-mix(in srgb, var(--c-sun) 60%, transparent);\n}\n.badge .when {\n  display: inline-block;\n  margin-top: 0.6rem;\n  padding: 0.15rem 0.6rem;\n  font-size: 0.75rem; font-weight: 700;\n  color: var(--ok-ink);\n  background: var(--ok-soft);\n  border-radius: var(--r-pill);\n}\n\n\n/* ==========================================================================\n   13. EDUCATORS\n   ========================================================================== */\n\n.teacher-panel {\n  background: var(--bg-card);\n  border: 1px solid var(--line);\n  border-radius: var(--r-xl);\n  box-shadow: var(--shadow);\n  padding: clamp(1.25rem, 3vw, 1.9rem);\n  margin-bottom: 3rem;\n}\n.teacher-panel .head {\n  display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;\n  align-items: baseline; justify-content: space-between;\n  margin-bottom: 1rem;\n}\n.teacher-panel .head h2 { margin: 0; }\n.class-meta { font-size: 0.88rem; color: var(--ink-soft); font-weight: 600; }\n.demo-note {\n  padding: 0.9rem 1.1rem;\n  background: var(--c-warm-soft);\n  border-radius: var(--r);\n  font-size: 0.9rem;\n  line-height: 1.55;\n  margin-bottom: 1.5rem;\n}\nbody[data-contrast=\"high\"] .demo-note { border: 2px solid var(--accent); }\n\n.roster { width: 100%; border-collapse: collapse; font-size: 0.92rem; }\n.roster th {\n  text-align: left;\n  font-family: var(--font-brand); font-weight: 800;\n  font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;\n  color: var(--ink-soft);\n  padding: 0 0.75rem 0.75rem;\n  border-bottom: 2px solid var(--line);\n}\n.roster td { padding: 0.95rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: middle; }\n.roster tbody tr:last-child td { border-bottom: 0; }\n.roster tbody tr { transition: background calc(0.15s * var(--motion-scale)) ease; }\n.roster tbody tr:hover { background: var(--bg-sunk); }\n.student { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-brand); font-weight: 700; white-space: nowrap; }\n.roster td:nth-child(2) .tag { margin: 0 0.3rem 0.3rem 0; }\n.roster td:nth-child(3) { white-space: nowrap; font-family: var(--font-brand); font-weight: 700; }\n.roster td:nth-child(3) .progress-bar { display: inline-block; width: 5.5rem; vertical-align: middle; margin-right: 0.5rem; height: 0.65rem; }\n.roster td:nth-child(4) { color: var(--ink-soft); font-size: 0.88rem; min-width: 13rem; }\n\n.tag {\n  display: inline-block;\n  padding: 0.22rem 0.65rem;\n  font-size: 0.78rem; font-weight: 700;\n  font-family: var(--font-brand);\n  color: var(--ink-soft);\n  background: var(--bg-sunk);\n  border: 1px solid var(--line);\n  border-radius: var(--r-pill);\n  white-space: nowrap;\n}\n.tag.accent { color: var(--accent-strong); background: var(--c-accent-soft); border-color: transparent; }\n.tag.warm { color: var(--cat-stories-ink); background: var(--c-warm-soft); border-color: transparent; }\n\n\n/* ==========================================================================\n   14. PROSE PAGES\n   ========================================================================== */\n\n/* Left-aligned, not centred: the page intro above it starts at the container\n   edge, and a centred column would leave a visible jog between the two. */\n.prose { max-width: var(--container-narrow); }\n.prose h2 { margin: 2.5rem 0 0.75rem; }\n.prose > h2:first-child, .prose > *:first-child { margin-top: 0; }\n.prose h3 { margin: 1.75rem 0 0.5rem; }\n.prose p, .prose li { color: var(--ink-soft); }\n.prose li { margin-bottom: 0.5rem; }\n.prose ul, .prose ol { padding-left: 1.35rem; margin: 0 0 1.25rem; }\n.prose blockquote {\n  margin: 1.5rem 0;\n  padding: 1rem 1.25rem;\n  background: var(--bg-soft);\n  border-left: 4px solid var(--accent);\n  border-radius: var(--r-sm);\n  font-style: italic;\n}\n.prose table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; font-size: 0.92rem; }\n.prose th, .prose td { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--line); }\n.prose th { font-family: var(--font-brand); font-weight: 800; }\n.prose code {\n  background: var(--bg-sunk);\n  border: 1px solid var(--line);\n  border-radius: 5px;\n  padding: 0.1em 0.4em;\n  font-size: 0.9em;\n}\n\n/* About-page intro row (visual + text) */\n.intro-row {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) minmax(0, 0.55fr);\n  gap: clamp(1.5rem, 4vw, 3rem);\n  align-items: center;\n}\n.intro-text { min-width: 0; }\n.intro-visual { display: grid; place-items: center; min-width: 0; }\n.intro-orb {\n  position: relative;\n  display: grid; place-items: center;\n  width: min(13rem, 45vw);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  background: var(--bg-card);\n  border: 2px solid var(--line);\n  box-shadow: var(--shadow);\n}\n.intro-emoji { font-size: clamp(2.5rem, 8vw, 4rem); }\n\n\n/* ==========================================================================\n   15. TOAST, INDICATORS, UTILITIES\n   ========================================================================== */\n\n.toast {\n  position: fixed;\n  left: 50%; bottom: 1.5rem;\n  transform: translate(-50%, 150%);\n  z-index: 200;\n  display: flex; align-items: center; gap: 0.9rem;\n  max-width: min(26rem, calc(100vw - 2rem));\n  padding: 0.9rem 1.25rem;\n  background: var(--bg-card);\n  border: 1px solid var(--line);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-lg);\n  opacity: 0;\n  transition: transform calc(0.35s * var(--motion-scale)) cubic-bezier(0.34, 1.4, 0.64, 1),\n              opacity calc(0.25s * var(--motion-scale)) ease;\n}\n.toast.show { transform: translate(-50%, 0); opacity: 1; }\n.toast .icon {\n  display: grid; place-items: center;\n  width: 2.6rem; height: 2.6rem;\n  border-radius: 50%;\n  background: color-mix(in srgb, var(--c-sun) 28%, var(--bg-card));\n  font-size: 1.3rem;\n  flex: none;\n}\n.toast .title { font-family: var(--font-brand); font-weight: 800; font-size: 0.95rem; }\n.toast .meta { font-size: 0.85rem; color: var(--ink-soft); }\n\n.voice-indicator {\n  position: fixed;\n  right: 1rem; bottom: 1rem;\n  z-index: 90;\n  padding: 0.5rem 0.95rem;\n  background: var(--accent);\n  color: var(--accent-ink);\n  border-radius: var(--r-pill);\n  font-family: var(--font-brand); font-weight: 700; font-size: 0.82rem;\n  box-shadow: var(--shadow);\n  opacity: 0;\n  pointer-events: none;\n  transition: opacity calc(0.2s * var(--motion-scale)) ease;\n}\n.voice-indicator.on { opacity: 1; }\n\n\n/* ==========================================================================\n   16. RESPONSIVE\n   ========================================================================== */\n\n@media (max-width: 62rem) {\n  .hero-content { grid-template-columns: 1fr; }\n  .hero-visual { order: -1; justify-items: start; }\n  .hero-orb { width: min(14rem, 45vw); }\n  .float-chip { width: 2.4rem; height: 2.4rem; font-size: 1.1rem; }\n  .intro-row { grid-template-columns: 1fr; }\n  .intro-visual { justify-items: start; }\n}\n\n@media (max-width: 52rem) {\n  :root { --nav-h: 3.75rem; }\n\n  .nav-toggle { display: inline-block; }\n  .nav-links {\n    display: none;\n    flex-basis: 100%;\n    flex-direction: column;\n    align-items: stretch;\n    gap: 0.2rem;\n    padding-bottom: 0.85rem;\n  }\n  .nav-links.open { display: flex; }\n  .nav-links a { padding: 0.7rem 1rem; }\n\n  /* Library becomes a snap carousel on small screens */\n  .lib-grid {\n    display: flex;\n    gap: 0.9rem;\n    overflow-x: auto;\n    scroll-snap-type: x mandatory;\n    padding-bottom: 0.5rem;\n    -webkit-overflow-scrolling: touch;\n    scrollbar-width: none;\n  }\n  .lib-grid::-webkit-scrollbar { display: none; }\n  .passage-card { flex: 0 0 min(20rem, 82vw); scroll-snap-align: start; }\n\n  .carousel-dots { display: flex; gap: 0.4rem; justify-content: center; margin-top: 1rem; }\n  .carousel-dot {\n    width: 0.5rem; height: 0.5rem;\n    padding: 0;\n    border: 0;\n    border-radius: var(--r-pill);\n    background: var(--line-strong);\n    cursor: pointer;\n    transition: all calc(0.2s * var(--motion-scale)) ease;\n  }\n  .carousel-dot.active { width: 1.5rem; background: var(--accent); }\n\n  /* Once the toolbar wraps, the vertical rules land at row ends and read as noise. */\n  .reader-controls { border-radius: var(--r-lg); }\n  .reader-controls .sep { display: none; }\n  .site-footer .container { flex-direction: column; align-items: flex-start; }\n\n  /* Roster becomes stacked cards */\n  .roster thead { display: none; }\n  .roster, .roster tbody, .roster tr, .roster td { display: block; width: 100%; }\n  .roster tr {\n    background: var(--bg-sunk);\n    border: 1px solid var(--line);\n    border-radius: var(--r);\n    padding: 0.85rem 1rem;\n    margin-bottom: 0.85rem;\n  }\n  .roster td, .roster tbody tr:last-child td { border: 0; padding: 0.35rem 0; }\n  .roster td::before {\n    content: attr(data-lbl);\n    display: block;\n    font-family: var(--font-brand); font-weight: 800;\n    font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;\n    color: var(--ink-faint);\n    margin-bottom: 0.2rem;\n  }\n  .roster td:first-child::before { display: none; }\n  .roster td:nth-child(4) { min-width: 0; }\n}\n\n@media (max-width: 30rem) {\n  .btn, .btn.lg { width: 100%; }\n  .hero-actions, .setup-actions, .complete-actions, .filter-actions, .reflect-actions { flex-direction: column; align-items: stretch; }\n  .edit-name-link { text-align: center; }\n  .badge-grid { grid-template-columns: 1fr; }\n  .lib-stats { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }\n  .stat-card { padding: 0.8rem; gap: 0.6rem; }\n  .stat-ic { width: 2.25rem; height: 2.25rem; font-size: 1.05rem; }\n  .stat-num { font-size: 1.3rem; }\n  .reflect-actions .skip-note { text-align: center; }\n}\n\n@media print {\n  .site-nav, .site-footer, .reader-controls, .reflect, .toast, .voice-indicator, .back { display: none !important; }\n  .passage-body { max-width: none; }\n}\n";
var PAGES = {"index.html": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\" />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n<title>Saksham \u2014 a calmer way to read<\/title>\n<meta name=\"description\" content=\"A small reading library for neurodivergent learners. Set the font, contrast, pace, and motion to whatever your brain wants. Read at your own speed. Nothing is timed. Nothing is shared.\" />\n<style>/*__CSS__*/<\/style>\n<\/head>\n\n<body data-contrast=\"cream\" data-font=\"lexend\" data-size=\"m\" data-motion=\"full\">\n\n<a href=\"#main\" class=\"skip\">Skip to main content<\/a>\n\n<header class=\"site-nav\" role=\"banner\">\n  <div class=\"nav-inner\">\n    <a href=\"index.html\" class=\"brand\" aria-label=\"Saksham home\" data-voice=\"Saksham home\">\n      <span class=\"brand-mark\" aria-hidden=\"true\">\u0938<\/span>\n      <span>Saksham<\/span>\n    <\/a>\n    <button class=\"nav-toggle\" aria-expanded=\"false\" aria-controls=\"primaryNav\" id=\"navToggle\" data-i18n=\"menu\">\u2630 Menu<\/button>\n    <nav class=\"nav-links\" id=\"primaryNav\" aria-label=\"Primary\">\n      <a href=\"index.html\" class=\"current\" data-voice=\"Library\" data-i18n=\"nav_library\">Library<\/a>\n      <a href=\"achievements.html\" data-voice=\"Achievements\" data-i18n=\"nav_achievements\">Achievements<\/a>\n      <a href=\"educators.html\" data-voice=\"For educators\" data-i18n=\"nav_educators\">For educators<\/a>\n      <a href=\"about.html\" data-voice=\"About\" data-i18n=\"nav_about\">About<\/a>\n    <\/nav>\n  <\/div>\n<\/header>\n\n<main id=\"main\" tabindex=\"-1\">\n\n  <!-- ====================================================\n       SCREEN: FIRST-RUN SETUP\n       ==================================================== -->\n  <section class=\"screen\" id=\"screen-setup\" aria-labelledby=\"setup-title\" hidden>\n    <div class=\"setup\">\n      <div class=\"setup-card\">\n        <h1 id=\"setup-title\" data-i18n=\"setup_title\">Saksham \u2014 inclusive learning for all.<\/h1>\n        <p class=\"meaning\">\u0938\u0915\u094d\u0937\u092e \u00b7 capable<\/p>\n        <p class=\"lede\" data-i18n=\"setup_lede\">Empowering every learner, regardless of ability or background. Let's set things up for the way your brain works. Nothing here is permanent \u2014 you can change any of it later.<\/p>\n\n        <label for=\"setupName\" data-i18n=\"setup_name_label\">What should I call you?<\/label>\n        <input id=\"setupName\" type=\"text\" placeholder=\"Just a first name is fine\" data-i18n-ph=\"setup_name_ph\" maxlength=\"24\" autocomplete=\"off\" data-voice=\"What should I call you?\" />\n\n        <label data-i18n=\"setup_avatar_label\">Pick an avatar<\/label>\n        <div class=\"avatar-picks\" role=\"radiogroup\" aria-label=\"Avatar color\">\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"blue\" aria-pressed=\"true\" data-voice=\"Fox avatar\"><span class=\"avatar av-blue\" aria-hidden=\"true\">\ud83e\udd8a<\/span><span data-i18n=\"av_blue\">Fox<\/span><\/button>\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"green\" aria-pressed=\"false\" data-voice=\"Turtle avatar\"><span class=\"avatar av-green\" aria-hidden=\"true\">\ud83d\udc22<\/span><span data-i18n=\"av_green\">Turtle<\/span><\/button>\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"warm\" aria-pressed=\"false\" data-voice=\"Butterfly avatar\"><span class=\"avatar av-warm\" aria-hidden=\"true\">\ud83e\udd8b<\/span><span data-i18n=\"av_warm\">Butterfly<\/span><\/button>\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"sun\" aria-pressed=\"false\" data-voice=\"Bee avatar\"><span class=\"avatar av-sun\" aria-hidden=\"true\">\ud83d\udc1d<\/span><span data-i18n=\"av_sun\">Bee<\/span><\/button>\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"lav\" aria-pressed=\"false\" data-voice=\"Owl avatar\"><span class=\"avatar av-lav\" aria-hidden=\"true\">\ud83e\udd89<\/span><span data-i18n=\"av_lav\">Owl<\/span><\/button>\n          <button type=\"button\" class=\"avatar-pick\" data-avatar=\"rose\" aria-pressed=\"false\" data-voice=\"Panda avatar\"><span class=\"avatar av-rose\" aria-hidden=\"true\">\ud83d\udc3c<\/span><span data-i18n=\"av_rose\">Panda<\/span><\/button>\n        <\/div>\n\n        <div class=\"setup-actions\">\n          <button type=\"button\" class=\"btn\" id=\"setupSubmit\" data-voice=\"Open my library\" data-i18n=\"setup_open\">Open my library \u2192<\/button>\n          <button type=\"button\" class=\"btn ghost\" id=\"setupSkip\" data-voice=\"Skip setup\" data-i18n=\"setup_skip\">Skip \u2014 just call me Reader<\/button>\n        <\/div>\n        <div class=\"dots\" aria-hidden=\"true\">\n          <span class=\"on\"><\/span><span><\/span><span><\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ====================================================\n       SCREEN: HOME \u2014 clean hero + library\n       ==================================================== -->\n  <section class=\"screen active\" id=\"screen-home\" aria-labelledby=\"home-title\">\n\n    <!-- HERO -->\n    <section class=\"hero-section\" aria-labelledby=\"home-title\">\n      <div class=\"container\">\n        <div class=\"hero-content\">\n          <div class=\"hero-text\">\n            <p class=\"hero-eyebrow\"><span id=\"helloGreeting\">Welcome back<\/span><\/p>\n            <h1 id=\"home-title\"><span id=\"helloName\">Jasmine<\/span><span class=\"name-dot\">.<\/span><\/h1>\n            <p class=\"hero-sub\" id=\"helloLine\">Pick something to read at your own pace. Nothing here is timed, and your settings travel with you across every page.<\/p>\n\n            <div class=\"hero-progress\">\n              <div class=\"progress-row\">\n                <span id=\"readCountLabel\"><\/span>\n                <a href=\"achievements.html\" data-i18n=\"milestones\">Milestones \u2192<\/a>\n              <\/div>\n              <div class=\"progress-bar\" aria-hidden=\"true\">\n                <div class=\"progress-fill\" id=\"progressFill\" style=\"width: 0%\"><\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"hero-actions\">\n              <button class=\"btn lg\" id=\"continueBtn\" data-voice=\"Continue reading\">Continue reading \u2192<\/button>\n              <button class=\"btn ghost\" id=\"openPrefsBtn\" data-voice=\"Reading preferences\" data-i18n=\"reading_prefs\">\u2699 Reading preferences<\/button>\n              <button class=\"edit-name-link\" id=\"editName\" data-voice=\"Change name\" data-i18n=\"change_name\">Not me? Change name<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"hero-visual\" aria-hidden=\"true\">\n            <div class=\"hero-orb\">\n              <span class=\"orb-ring orb-ring-1\"><\/span>\n              <span class=\"orb-ring orb-ring-2\"><\/span>\n              <span class=\"avatar av-blue\" id=\"helloAvatar\">\ud83e\udd8a<\/span>\n              <span class=\"float-chip chip-book\">\ud83d\udcd6<\/span>\n              <span class=\"float-chip chip-star\">\u2b50<\/span>\n              <span class=\"float-chip chip-leaf\">\ud83c\udf31<\/span>\n            <\/div>\n          <\/div>\n\n        <\/div>\n      <\/div>\n    <\/section>\n\n    <!-- LIBRARY SECTION -->\n    <section class=\"library-section\">\n      <div class=\"container\">\n        <div class=\"library-header\">\n          <h2 data-i18n=\"your_library\">Your library<\/h2>\n          <div class=\"library-tools\">\n            <button type=\"button\" class=\"btn ghost\" id=\"openFiltersBtn\" data-voice=\"Filter passages\" data-i18n=\"filter_passages\">Filter passages<\/button>\n          <\/div>\n        <\/div>\n        <p class=\"text-soft\" style=\"margin: 0 0 1.5rem;\" data-i18n=\"library_intro\">Short passages across three shelves. Words with a dotted underline have definitions \u2014 tap them.<\/p>\n\n\n      <div class=\"lib-stats\" id=\"libStats\" role=\"list\" aria-label=\"Library overview\">\n        <div class=\"stat-card s-blue\" role=\"listitem\">\n          <span class=\"stat-ic\" aria-hidden=\"true\">\ud83d\udcda<\/span>\n          <span class=\"stat-text\"><span class=\"stat-num\" id=\"statTotal\">8<\/span><span class=\"stat-label\">Passages<\/span><\/span>\n        <\/div>\n        <div class=\"stat-card s-green\" role=\"listitem\">\n          <span class=\"stat-ic\" aria-hidden=\"true\">\u2713<\/span>\n          <span class=\"stat-text\"><span class=\"stat-num\" id=\"statRead\">0<\/span><span class=\"stat-label\">Read<\/span><\/span>\n        <\/div>\n        <div class=\"stat-card s-purple\" role=\"listitem\">\n          <span class=\"stat-ic\" aria-hidden=\"true\">\ud83d\uddc2<\/span>\n          <span class=\"stat-text\"><span class=\"stat-num\" id=\"statCats\">3<\/span><span class=\"stat-label\">Categories<\/span><\/span>\n        <\/div>\n        <div class=\"stat-card s-warm\" role=\"listitem\">\n          <span class=\"stat-ic\" aria-hidden=\"true\">\u23f1<\/span>\n          <span class=\"stat-text\"><span class=\"stat-num\" id=\"statTime\">~30<\/span><span class=\"stat-label\">Minutes total<\/span><\/span>\n        <\/div>\n      <\/div>\n\n      <!-- Preferences (collapsed; opened by the hero's \"Reading preferences\" button) -->\n      <details class=\"prefs\" id=\"prefsPanel\">\n        <summary data-voice=\"Reading preferences\">\n          <span class=\"sum-icon\" aria-hidden=\"true\">\u2699<\/span>\n          <span class=\"sum-text\">\n            <span class=\"sum-title\" data-i18n=\"prefs_title\">Reading preferences<\/span>\n            <span class=\"hint\" data-i18n=\"prefs_hint\">Change anything. Every page remembers.<\/span>\n          <\/span>\n          <span class=\"sum-toggle\" aria-hidden=\"true\"><span class=\"chev\">\u25be<\/span><\/span>\n        <\/summary>\n        <div class=\"prefs-body\">\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"font\">Font<\/h4>\n              <span class=\"pref-value\" id=\"lblFont\">Lexend<\/span>\n            <\/div>\n            <div class=\"chips\" role=\"radiogroup\" aria-label=\"Font\">\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"font\" data-value=\"atkinson\" data-voice=\"Atkinson font\">Atkinson<\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"true\" aria-pressed=\"true\" data-set=\"font\" data-value=\"lexend\" data-voice=\"Lexend font\">Lexend<\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"font\" data-value=\"opendys\" data-voice=\"Open Dyslexic font\">OpenDyslexic<\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"font\" data-value=\"system\" data-voice=\"System font\">System<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"size\">Size<\/h4>\n              <span class=\"pref-value\" id=\"lblSize\">Medium<\/span>\n            <\/div>\n            <div class=\"chips\" role=\"radiogroup\" aria-label=\"Size\">\n              <button class=\"chip\" role=\"radio\" aria-checked=\"true\" aria-pressed=\"true\" data-set=\"size\" data-value=\"m\" data-voice=\"Medium\">M<\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"size\" data-value=\"l\" data-voice=\"Large\">L<\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"size\" data-value=\"xl\" data-voice=\"Extra large\">XL<\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"theme\">Theme<\/h4>\n              <span class=\"pref-value\" id=\"lblContrast\">Warm cream<\/span>\n            <\/div>\n            <div class=\"swatch-row\" role=\"radiogroup\" aria-label=\"Theme\">\n              <button class=\"swatch-btn\" role=\"radio\" aria-checked=\"true\" aria-pressed=\"true\" data-set=\"contrast\" data-value=\"cream\" data-voice=\"Warm cream theme\">\n                <span class=\"sw\" style=\"background:#FFFBF5;border-color:#E5DAC2;\"><\/span><span data-i18n=\"theme_cream\">Cream<\/span>\n              <\/button>\n              <button class=\"swatch-btn\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"contrast\" data-value=\"soft\" data-voice=\"Soft blue theme\">\n                <span class=\"sw\" style=\"background:#F1F4FB;border-color:#D2DCEA;\"><\/span><span data-i18n=\"theme_soft\">Soft<\/span>\n              <\/button>\n              <button class=\"swatch-btn\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"contrast\" data-value=\"dark\" data-voice=\"Dark theme\">\n                <span class=\"sw\" style=\"background:#14181F;border-color:#2A3140;\"><\/span><span data-i18n=\"theme_dark\">Dark<\/span>\n              <\/button>\n              <button class=\"swatch-btn\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"contrast\" data-value=\"high\" data-voice=\"High contrast theme\">\n                <span class=\"sw\" style=\"background:#000;border-color:#FFD301;\"><\/span><span data-i18n=\"theme_high\">High<\/span>\n              <\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"motion\">Motion<\/h4>\n              <span class=\"pref-value\" id=\"lblMotion\">Full<\/span>\n            <\/div>\n            <div class=\"chips\" role=\"radiogroup\" aria-label=\"Motion\">\n              <button class=\"chip\" role=\"radio\" aria-checked=\"true\" aria-pressed=\"true\" data-set=\"motion\" data-value=\"full\" data-voice=\"Full motion\"><span data-i18n=\"motion_full\">Full<\/span><\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"motion\" data-value=\"reduced\" data-voice=\"Reduced motion\"><span data-i18n=\"motion_reduced\">Reduced<\/span><\/button>\n              <button class=\"chip\" role=\"radio\" aria-checked=\"false\" aria-pressed=\"false\" data-set=\"motion\" data-value=\"none\" data-voice=\"No motion\"><span data-i18n=\"motion_none\">None<\/span><\/button>\n            <\/div>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"readaloud\">Read-aloud<\/h4>\n              <span class=\"pref-value\">\n                <label class=\"switch\">\n                  <input id=\"setAudio\" type=\"checkbox\" checked />\n                  <span class=\"track\" aria-hidden=\"true\"><\/span>\n                  <span class=\"sr-only\">Read-aloud available<\/span>\n                <\/label>\n              <\/span>\n            <\/div>\n            <p class=\"text-soft\" style=\"font-size: 0.85rem; margin: 0;\" data-i18n=\"readaloud_desc\">Hear the words while you see them.<\/p>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"voicecues\">Voice cues<\/h4>\n              <span class=\"pref-value\">\n                <label class=\"switch\">\n                  <input id=\"setVoice\" type=\"checkbox\" />\n                  <span class=\"track\" aria-hidden=\"true\"><\/span>\n                  <span class=\"sr-only\">Voice cues on focus<\/span>\n                <\/label>\n              <\/span>\n            <\/div>\n            <p class=\"text-soft\" style=\"font-size: 0.85rem; margin: 0;\" data-i18n=\"voicecues_desc\">Speaks button labels when you focus on them. For emerging readers.<\/p>\n          <\/div>\n\n          <div class=\"pref-group\">\n            <div class=\"pref-label\">\n              <h4 data-i18n=\"pace\">Pace<\/h4>\n              <span class=\"pref-value\" id=\"lblPace\">0.9\u00d7<\/span>\n            <\/div>\n            <input id=\"setPace\" type=\"range\" min=\"0.5\" max=\"1.5\" step=\"0.1\" value=\"0.9\" aria-label=\"Reading pace\" />\n          <\/div>\n\n        <\/div>\n      <\/details>\n\n      <!-- Filter panel (Figma \"Search Filter\" modal, now an inline collapsible) -->\n      <details class=\"filter-panel\" id=\"filterPanel\">\n        <summary data-voice=\"Find passages that fit you\">\n          <span class=\"sum-icon filter-icon\" aria-hidden=\"true\">\ud83d\udd0d<\/span>\n          <span class=\"sum-text\">\n            <span class=\"sum-title\" data-i18n=\"filter_title\">Find passages that fit you<\/span>\n            <span class=\"hint\" id=\"filterHint\">Filter by language, learning need, or grade.<\/span>\n          <\/span>\n          <span class=\"sum-toggle\" aria-hidden=\"true\"><span class=\"chev\">\u25be<\/span><\/span>\n        <\/summary>\n        <div class=\"filter-body\">\n          <div class=\"filter-group\">\n            <h4 data-i18n=\"f_language\">Language<\/h4>\n            <div class=\"chips\" role=\"group\" aria-label=\"Language\">\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"english\" aria-pressed=\"true\">English<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"hindi\" aria-pressed=\"false\">\u0939\u093f\u0928\u094d\u0926\u0940 Hindi<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"bengali\" aria-pressed=\"false\">\u09ac\u09be\u0982\u09b2\u09be Bengali<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"marathi\" aria-pressed=\"false\">\u092e\u0930\u093e\u0920\u0940 Marathi<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"gujarati\" aria-pressed=\"false\">\u0a97\u0ac1\u0a9c\u0ab0\u0abe\u0aa4\u0ac0 Gujarati<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"lang\" data-val=\"telugu\" aria-pressed=\"false\">\u0c24\u0c46\u0c32\u0c41\u0c17\u0c41 Telugu<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"filter-group\">\n            <h4 data-i18n=\"f_needs\">Learning needs<\/h4>\n            <div class=\"chips\" role=\"group\" aria-label=\"Learning needs\">\n              <button type=\"button\" class=\"chip\" data-filter=\"need\" data-val=\"dyslexia\" aria-pressed=\"false\" data-i18n=\"need_dyslexia\">Dyslexia<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"need\" data-val=\"adhd\" aria-pressed=\"false\" data-i18n=\"need_adhd\">ADHD<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"need\" data-val=\"autism\" aria-pressed=\"false\" data-i18n=\"need_autism\">Autism<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"need\" data-val=\"speech\" aria-pressed=\"false\" data-i18n=\"need_speech\">Speech<\/button>\n              <button type=\"button\" class=\"chip\" data-filter=\"need\" data-val=\"visual\" aria-pressed=\"false\" data-i18n=\"need_visual\">Visual / Motor<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"filter-group\">\n            <h4 data-i18n=\"f_grade\">Grade level<\/h4>\n            <div class=\"grade-row\" role=\"group\" aria-label=\"Grade level\">\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"1\">1<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"2\">2<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"3\">3<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"4\">4<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"5\">5<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"6\" aria-pressed=\"true\">6<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"7\">7<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"8\">8<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"9\">9<\/button>\n              <button type=\"button\" class=\"grade\" data-filter=\"grade\" data-val=\"10\">10<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"filter-result\" id=\"filterResult\">English \u00b7 Grade 6 \u00b7 Showing all 8 passages.<\/div>\n          <div class=\"filter-actions\">\n            <button type=\"button\" class=\"btn ghost\" id=\"filterClear\" data-i18n=\"filter_clear\">Clear all<\/button>\n            <button type=\"button\" class=\"btn\" id=\"filterApply\" data-i18n=\"filter_apply\">Apply filters<\/button>\n          <\/div>\n        <\/div>\n      <\/details>\n\n      <!-- Library \u2014 category tiles act as filters over one clean grid -->\n      <div class=\"library\" id=\"library\">\n\n        <div class=\"lib-carousel\">\n          <button type=\"button\" class=\"carousel-nav prev\" id=\"libPrev\" aria-label=\"Scroll left\" data-voice=\"Previous passages\">\u2039<\/button>\n          <div class=\"lib-grid lib-track\" id=\"grid-all\" role=\"list\"><\/div>\n          <button type=\"button\" class=\"carousel-nav next\" id=\"libNext\" aria-label=\"Scroll right\" data-voice=\"More passages\">\u203a<\/button>\n        <\/div>\n        <div class=\"carousel-dots\" id=\"libDots\" aria-hidden=\"true\"><\/div>\n      <\/div>\n\n      <\/div>\n    <\/section>\n  <\/section>\n\n  <!-- ====================================================\n       SCREEN: READER\n       ==================================================== -->\n  <section class=\"screen\" id=\"screen-reader\" aria-labelledby=\"reader-title\">\n    <div class=\"container\">\n      <div class=\"reader\">\n        <button class=\"back\" id=\"backToLib\" data-voice=\"Back to library\" data-i18n=\"back_to_library\">\u2190 Back to library<\/button>\n        <p class=\"reader-eyebrow\" id=\"readerEyebrow\"><\/p>\n        <h1 id=\"reader-title\"><\/h1>\n        <div class=\"reader-meta\" id=\"reader-meta\"><\/div>\n        <div class=\"para-progress\" id=\"paraProgress\" aria-hidden=\"true\"><\/div>\n\n        <div class=\"reader-controls\" role=\"toolbar\" aria-label=\"Reader controls\">\n          <div class=\"grp\">\n            <button class=\"icon-btn\" id=\"playBtn\" aria-label=\"Read aloud\" data-voice=\"Read aloud\" data-i18n=\"read_aloud\">\u25b6 Read aloud<\/button>\n            <button class=\"icon-btn\" id=\"stopBtn\" aria-label=\"Stop reading\" data-voice=\"Stop reading\" data-i18n=\"stop\" hidden>\u25a0 Stop<\/button>\n          <\/div>\n          <span class=\"sep\" aria-hidden=\"true\"><\/span>\n          <div class=\"grp\">\n            <label for=\"paceLive\" class=\"sr-only\">Pace<\/label>\n            <span class=\"text-soft\" aria-hidden=\"true\" style=\"font-size: 0.85rem;\" data-i18n=\"pace\">Pace<\/span>\n            <input id=\"paceLive\" type=\"range\" min=\"0.5\" max=\"1.5\" step=\"0.1\" value=\"0.9\" class=\"pace-slider\" />\n            <span class=\"pace-val\" id=\"paceLiveVal\">0.9\u00d7<\/span>\n          <\/div>\n          <span class=\"sep\" aria-hidden=\"true\"><\/span>\n          <div class=\"grp\">\n            <a href=\"#prefsPanel\" class=\"icon-btn\" id=\"openPrefs\" data-voice=\"More preferences\" data-i18n=\"more_prefs\">\u2699 More preferences<\/a>\n          <\/div>\n        <\/div>\n\n        <article class=\"passage-body\" id=\"passageBody\" aria-live=\"polite\"><\/article>\n\n        <!-- Reflection panel (replaces the simple finish card) -->\n        <div class=\"reflect\">\n          <div class=\"prev-reflection\" id=\"prevReflection\" hidden>\n            <span class=\"lbl\" data-i18n=\"your_last_note\">Your last note<\/span>\n            <span id=\"prevReflectionText\"><\/span>\n          <\/div>\n          <h3 data-i18n=\"reflect_title\">Take a moment.<\/h3>\n          <p class=\"prompt\" id=\"reflectPrompt\">What's one thing you'd remember?<\/p>\n          <textarea id=\"reflectText\" maxlength=\"280\" placeholder=\"Type a sentence or two. Or leave it empty. Both are fine.\" data-i18n-ph=\"reflect_ph\"><\/textarea>\n          <div class=\"reflect-meta\">\n            <span id=\"reflectCount\">0 / 280<\/span>\n            <span data-i18n=\"reflect_saved\">Saved to this device only.<\/span>\n          <\/div>\n          <div class=\"reflect-actions\">\n            <button class=\"btn\" id=\"markRead\" data-voice=\"Mark as read\" data-i18n=\"i_read_this\">I read this<\/button>\n            <span class=\"skip-note\" data-i18n=\"skip_note\">You can leave the note empty \u2014 it's not a test.<\/span>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ====================================================\n       SCREEN: COMPLETION (after marking a passage read)\n       ==================================================== -->\n  <section class=\"screen\" id=\"screen-complete\" aria-labelledby=\"complete-title\">\n    <div class=\"container\">\n      <div class=\"complete\">\n        <div class=\"complete-card\">\n          <div class=\"complete-icon\" aria-hidden=\"true\">\u2713<\/div>\n          <h1 id=\"complete-title\">Nice. You read that.<\/h1>\n          <p class=\"complete-sub\" id=\"completeSub\" data-i18n=\"complete_sub\">Take a breath. There's no rush on what's next.<\/p>\n          <p class=\"saved-line\" id=\"completeSaved\" data-i18n=\"complete_saved\" hidden>Your note has been saved to this device.<\/p>\n\n          <div class=\"next-suggest\" id=\"nextSuggest\">\n            <h4 data-i18n=\"try_next\">Try this next?<\/h4>\n            <button type=\"button\" class=\"next-card\" id=\"nextCard\">\n              <div class=\"meta\" id=\"nextMeta\"><\/div>\n              <h3 id=\"nextTitle\"><\/h3>\n              <p id=\"nextPreview\"><\/p>\n            <\/button>\n          <\/div>\n\n          <div class=\"all-done\" id=\"allDone\" hidden>\n            <span data-i18n=\"all_done\">\ud83c\udf31 You've read every passage in the library. Come back any time \u2014 re-reading counts.<\/span>\n          <\/div>\n\n          <div class=\"complete-actions\">\n            <button class=\"btn ghost\" id=\"completeBack\" data-voice=\"Back to library\" data-i18n=\"back_to_library2\">Back to library<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n<\/main>\n\n<!-- Achievement toast -->\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\n  <div class=\"icon\" id=\"toastIcon\" aria-hidden=\"true\">\u2b50<\/div>\n  <div>\n    <div class=\"lbl\" data-i18n=\"milestone_label\">Milestone<\/div>\n    <div class=\"title\" id=\"toastTitle\"><\/div>\n  <\/div>\n<\/div>\n\n<!-- Voice cue indicator -->\n<div class=\"voice-indicator\" id=\"voiceIndicator\" aria-hidden=\"true\" data-i18n=\"voice_on\">\ud83d\udd0a Voice cues on<\/div>\n\n<footer class=\"site-footer\">\n  <div class=\"container\">\n    <div data-i18n=\"footer_tagline\">Saksham \u2014 capable learning, your way.<\/div>\n    <div class=\"footer-links\">\n      <a href=\"achievements.html\" data-i18n=\"nav_achievements\">Achievements<\/a>\n      <a href=\"educators.html\" data-i18n=\"nav_educators\">For educators<\/a>\n      <a href=\"about.html\" data-i18n=\"nav_about\">About<\/a>\n      <a href=\"https://github.com/jsayed23/saksham-reading-library\" target=\"_blank\" rel=\"noopener\" data-i18n=\"footer_source\">Source<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<script>\n/* =========================================================================\n   SAKSHAM \u2014 Internationalisation data\n   -------------------------------------------------------------------------\n   This file holds every translatable string in the app, in six languages:\n     en  English      hi  \u0939\u093f\u0928\u094d\u0926\u0940 (Hindi)      bn  \u09ac\u09be\u0982\u09b2\u09be (Bengali)\n     mr  \u092e\u0930\u093e\u0920\u0940 (Marathi)  gu  \u0a97\u0ac1\u0a9c\u0ab0\u0abe\u0aa4\u0ac0 (Gujarati)  te  \u0c24\u0c46\u0c32\u0c41\u0c17\u0c41 (Telugu)\n\n   Two exports are attached to window:\n     \u2022 SAKSHAM_LANGS   \u2014 list of languages (code, native + english name, speech tag)\n     \u2022 SAKSHAM_STRINGS \u2014 interface labels, keyed by language code\n     \u2022 SAKSHAM_PASSAGES \u2014 the reading library; each passage carries a per-language\n       block with its title, paragraphs, vocabulary, and reflection prompt.\n\n   NOTE ON TRANSLATION QUALITY: the non-English passages were drafted with an AI\n   translator and should be proofread by a native speaker before classroom use.\n   They are faithful in meaning but may need polish for register and idiom.\n   ========================================================================= */\n\n/* Languages, in the order they appear in the filter. `speech` is the BCP-47\n   tag handed to the Web Speech API; if the reader's device has no voice for\n   that tag, read-aloud falls back to the default voice. */\nwindow.SAKSHAM_LANGS = [\n  { code: \"english\",  key: \"en\", native: \"English\",      english: \"English\",  speech: \"en-US\" },\n  { code: \"hindi\",    key: \"hi\", native: \"\u0939\u093f\u0928\u094d\u0926\u0940\",        english: \"Hindi\",    speech: \"hi-IN\" },\n  { code: \"bengali\",  key: \"bn\", native: \"\u09ac\u09be\u0982\u09b2\u09be\",         english: \"Bengali\",  speech: \"bn-IN\" },\n  { code: \"marathi\",  key: \"mr\", native: \"\u092e\u0930\u093e\u0920\u0940\",          english: \"Marathi\",  speech: \"mr-IN\" },\n  { code: \"gujarati\", key: \"gu\", native: \"\u0a97\u0ac1\u0a9c\u0ab0\u0abe\u0aa4\u0ac0\",        english: \"Gujarati\", speech: \"gu-IN\" },\n  { code: \"telugu\",   key: \"te\", native: \"\u0c24\u0c46\u0c32\u0c41\u0c17\u0c41\",         english: \"Telugu\",   speech: \"te-IN\" }\n];\n\n/* Interface strings. Placeholders {n}, {t}, {g}, {lang} are filled at runtime.\n   Keys are grouped by screen for readability. */\nwindow.SAKSHAM_STRINGS = {\n  en: {\n    nav_library: \"Library\", nav_achievements: \"Achievements\", nav_educators: \"For educators\", nav_about: \"About\", menu: \"\u2630 Menu\",\n\n    setup_title: \"Saksham \u2014 inclusive learning for all.\",\n    setup_meaning: \"\u0938\u0915\u094d\u0937\u092e \u00b7 capable\",\n    setup_lede: \"Empowering every learner, whatever their ability or background. Let's set things up for the way your brain works. Nothing here is permanent \u2014 you can change any of it later.\",\n    setup_name_label: \"What should I call you?\",\n    setup_name_ph: \"Just a first name is fine\",\n    setup_avatar_label: \"Pick an avatar\",\n    setup_open: \"Open my library \u2192\", setup_skip: \"Skip \u2014 just call me Reader\",\n    av_blue: \"Fox\", av_green: \"Turtle\", av_warm: \"Butterfly\", av_sun: \"Bee\", av_lav: \"Owl\", av_rose: \"Panda\",\n\n    g_welcome: \"Welcome\", g_welcome_back: \"Welcome back\", g_morning: \"Good morning\", g_afternoon: \"Good afternoon\", g_evening: \"Good evening\", g_late: \"Up late\", g_done: \"Done \u2014 and welcome back\",\n    hero_sub_new: \"Pick something to read at your own pace. Words with a dotted underline have definitions you can tap. Your settings travel with you across every page.\",\n    hero_sub_mid: \"Pick up where you left off, or try something new. Nothing here is timed.\",\n    hero_sub_done: \"You've read everything. Re-reading counts. Or come back tomorrow.\",\n    read_count: \"{n} of {t} passages read\",\n    milestones: \"Milestones \u2192\", continue_reading: \"Continue reading \u2192\", browse_l 92c \u092f\u0947 \u091c\u0921\u093c\u0947\u0902 \u091c\u093c\u092e\u0940\u0928 \u0915\u094b \u091b\u0942\u0924\u0940 \u0939\u0948\u0902, \u0924\u094b \u092e\u093f\u091f\u094d\u091f\u0940 \u092e\u0947\u0902 \u0909\u0924\u0930\u0915\u0930 \u0928\u090f \u0924\u0928\u0947 \u092c\u0928 \u091c\u093e\u0924\u0940 \u0939\u0948\u0902\u0964 \u0915\u0908 \u0938\u093e\u0932\u094b\u0902 \u092c\u093e\u0926 \u090f\u0915 \u092c\u0930\u0917\u0926 \u0915\u093e \u092a\u0947\u0921\u093c \u091b\u094b\u091f\u0947 \u091c\u0902\u0917\u0932 \u091c\u0948\u0938\u093e \u0926\u093f\u0916 \u0938\u0915\u0924\u093e \u0939\u0948\u0964 \u092d\u093e\u0930\u0924 \u092e\u0947\u0902 \u0915\u0941\u091b \u092c\u0930\u0917\u0926 \u0926\u094b \u0939\u091c\u093c\u093e\u0930 \u0938\u093e\u0932 \u0938\u0947 \u092d\u0940 \u092a\u0941\u0930\u093e\u0928\u0947 \u0939\u0948\u0902\u0964 \u0932\u094b\u0917 \u0909\u0928\u0915\u0947 \u0928\u0940\u091a\u0947 \u092c\u0948\u0920\u0915\u0930 \u0906\u0930\u093e\u092e \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u092c\u093e\u0924\u0947\u0902 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092a\u0922\u093c\u0924\u0947 \u0939\u0948\u0902\u0964\",\n        \"\u0935\u0948\u091c\u094d\u091e\u093e\u0928\u093f\u0915 \u092c\u0930\u0917\u0926 \u0915\u094b \u0905\u0902\u091c\u0940\u0930 \u0915\u093e \u092a\u0947\u0921\u093c \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964 \u0907\u0938\u0915\u093e \u092b\u0932 \u091b\u094b\u091f\u093e \u0914\u0930 \u0917\u094b\u0932 \u0939\u094b\u0924\u093e \u0939\u0948, \u0914\u0930 \u092a\u0915\u094d\u0937\u093f\u092f\u094b\u0902 \u0915\u094b \u092c\u0939\u0941\u0924 \u092a\u0938\u0902\u0926 \u0939\u0948\u0964 \u091c\u092c \u0915\u094b\u0908 \u092a\u0915\u094d\u0937\u0940 \u0905\u0902\u091c\u0940\u0930 \u0916\u093e\u0915\u0930 \u0926\u0942\u0938\u0930\u0947 \u092a\u0947\u0921\u093c \u092a\u0930 \u092c\u0948\u0920\u0924\u093e \u0939\u0948, \u0924\u094b \u092c\u0940\u091c \u0909\u0938\u0940 \u092a\u0947\u0921\u093c \u0915\u0940 \u0936\u093e\u0916\u093e \u092a\u0930 \u0905\u0902\u0915\u0941\u0930\u093f\u0924 \u0939\u094b \u0938\u0915\u0924\u093e \u0939\u0948\u0964 \u0907\u0938 \u0924\u0930\u0939 \u0928\u090f \u092c\u0930\u0917\u0926 \u0939\u0935\u093e \u092e\u0947\u0902 \u090a\u0901\u091a\u093e\u0908 \u092a\u0930 \u091c\u0940\u0935\u0928 \u0936\u0941\u0930\u0942 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u092b\u093f\u0930 \u091c\u093c\u092e\u0940\u0928 \u0915\u0940 \u0913\u0930 \u091c\u0921\u093c\u0947\u0902 \u092d\u0947\u091c\u0924\u0947 \u0939\u0948\u0902\u0964\"\n      ],\n      vocab: [\n        { word: \"\u0924\u0928\u093e\", def: \"\u092a\u0947\u0921\u093c \u0915\u093e \u092e\u0941\u0916\u094d\u092f \u092d\u093e\u0917, \u0935\u0939 \u092e\u094b\u091f\u093e \u0939\u093f\u0938\u094d\u0938\u093e \u091c\u094b \u0936\u093e\u0916\u093e\u0913\u0902 \u0915\u094b \u0925\u093e\u092e\u0947 \u0930\u0916\u0924\u093e \u0939\u0948\u0964\" },\n        { word: \"\u0905\u0902\u0915\u0941\u0930\u093f\u0924\", def: \"\u092c\u0922\u093c\u0928\u093e \u0936\u0941\u0930\u0942 \u0939\u094b\u0928\u093e\u0964 \u092c\u0940\u091c \u0924\u092c \u0905\u0902\u0915\u0941\u0930\u093f\u0924 \u0939\u094b\u0924\u093e \u0939\u0948 \u091c\u092c \u0909\u0938\u0915\u093e \u092a\u0939\u0932\u093e \u0928\u0928\u094d\u0939\u093e \u0905\u0902\u0915\u0941\u0930 \u0928\u093f\u0915\u0932\u0924\u093e \u0939\u0948\u0964\" }\n      ],\n      prompt: \"\u0915\u094d\u092f\u093e \u0906\u092a\u0915\u0947 \u0918\u0930 \u0915\u0947 \u092a\u093e\u0938 \u0915\u094b\u0908 \u0910\u0938\u093e \u092a\u0947\u0921\u093c \u0939\u0948 \u091c\u094b \u0906\u092a\u0915\u0947 \u092e\u094b\u0939\u0932\u094d\u0932\u0947 \u0915\u0947 \u0932\u093f\u090f \u0916\u093c\u093e\u0938 \u0939\u0948?\"\n    },\n    bn: {\n      title: \"\u09ac\u099f\u0997\u09be\u099b\",\n      paragraphs: [\n        \"\u09ad\u09be\u09b0\u09a4\u09c7\u09b0 \u0985\u09a8\u09c7\u0995 \u0997\u09cd\u09b0\u09be\u09ae\u09c7 \u099a\u0995\u09c7\u09b0 \u09ae\u09be\u099d\u0996\u09be\u09a8\u09c7\u09b0 \u09b8\u09ac\u099a\u09c7\u09af\u09bc\u09c7 \u09ac\u09a1\u09bc \u0997\u09be\u099b\u099f\u09bf \u09b9\u09b2\u09cb \u09ac\u099f\u0964 \u09ac\u099f\u0997\u09be\u099b \u0985\u09a8\u09cd\u09af \u0997\u09be\u099b\u09c7\u09b0 \u09ae\u09a4\u09cb \u0989\u0981\u099a\u09c1 \u09b9\u09af\u09bc \u09a8\u09be\u0964 \u09ac\u09b0\u0982 \u098f\u099f\u09bf \u099a\u0993\u09a1\u09bc\u09be\u09af\u09bc \u099b\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09aa\u09a1\u09bc\u09c7\u0964 \u098f\u09b0 \u09a1\u09be\u09b2\u09aa\u09be\u09b2\u09be \u09a6\u09c2\u09b0\u09c7 \u099b\u09a1\u09bc\u09be\u09af\u09bc, \u0986\u09b0 \u09b8\u09c7\u0987 \u09a1\u09be\u09b2 \u09a5\u09c7\u0995\u09c7 \u09b2\u09ae\u09cd\u09ac\u09be \u09b6\u09bf\u0995\u09a1\u09bc \u09a6\u09a1\u09bc\u09bf\u09b0 \u09ae\u09a4\u09cb \u09a8\u09bf\u099a\u09c7 \u099d\u09cb\u09b2\u09c7\u0964\",\n        \"\u09b6\u09bf\u0995\u09a1\u09bc \u09af\u0996\u09a8 \u09ae\u09be\u099f\u09bf \u099b\u09cb\u0981\u09af\u09bc, \u09a4\u0996\u09a8 \u09ae\u09be\u099f\u09bf\u09a4\u09c7 \u09a2\u09c1\u0995\u09c7 \u09a8\u09a4\u09c1\u09a8 \u0995\u09be\u09a3\u09cd\u09a1 \u09b9\u09af\u09bc\u09c7 \u0993\u09a0\u09c7\u0964 \u09ac\u09b9\u09c1 \u09ac\u099b\u09b0 \u09aa\u09b0\u09c7 \u098f\u0995\u099f\u09bf \u09ac\u099f\u0997\u09be\u099b \u099b\u09cb\u099f \u098f\u0995\u099f\u09bf \u09ac\u09a8\u09c7\u09b0 \u09ae\u09a4\u09cb \u09a6\u09c7\u0996\u09be\u09af\u09bc\u0964 \u09ad\u09be\u09b0\u09a4\u09c7\u09b0 \u0995\u09bf\u099b\u09c1 \u09ac\u099f\u0997\u09be\u099b \u09a6\u09c1'\u09b9\u09be\u099c\u09be\u09b0 \u09ac\u099b\u09b0\u09c7\u09b0\u0993 \u09aa\u09c1\u09b0\u09a8\u09cb\u0964 \u09ae\u09be\u09a8\u09c1\u09b7 \u09a4\u09be\u09b0 \u09a8\u09bf\u099a\u09c7 \u09ac\u09b8\u09c7 \u09ac\u09bf\u09b6\u09cd\u09b0\u09be\u09ae \u09a8\u09c7\u09af\u09bc, \u0995\u09a5\u09be \u09ac\u09b2\u09c7, \u09aa\u09a1\u09bc\u09be\u09b6\u09cb\u09a8\u09be \u0995\u09b0\u09c7\u0964\",\n        \"\u09ac\u09bf\u099c\u09cd\u099e\u09be\u09a8\u09c0\u09b0\u09be \u09ac\u099f\u0995\u09c7 \u09a1\u09c1\u09ae\u09c1\u09b0 \u099c\u09be\u09a4\u09c7\u09b0 \u0997\u09be\u099b \u09ac\u09b2\u09c7\u09a8\u0964 \u098f\u09b0 \u09ab\u09b2 \u099b\u09cb\u099f \u0993 \u0997\u09cb\u09b2, \u09aa\u09be\u0996\u09bf\u09b0\u09be \u0996\u09c1\u09ac \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09c7\u0964 \u0995\u09cb\u09a8\u09cb \u09aa\u09be\u0996\u09bf \u09a1\u09c1\u09ae\u09c1\u09b0 \u0996\u09c7\u09af\u09bc\u09c7 \u0985\u09a8\u09cd\u09af \u0997\u09be\u099b\u09c7 \u09ac\u09b8\u09b2\u09c7 \u09ac\u09c0\u099c\u099f\u09bf \u09b8\u09c7\u0987 \u0997\u09be\u099b\u09c7\u09b0 \u09a1\u09be\u09b2\u09c7\u0987 \u0985\u0999\u09cd\u0995\u09c1\u09b0\u09bf\u09a4 \u09b9\u09a4\u09c7 \u09aa\u09be\u09b0\u09c7\u0964 \u098f\u09ad\u09be\u09ac\u09c7\u0987 \u09a8\u09a4\u09c1\u09a8 \u09ac\u099f\u0997\u09be\u099b \u0985\u09a8\u09c7\u0995 \u0989\u0981\u099a\u09c1\u09a4\u09c7 \u09ac\u09be\u09a4\u09be\u09b8\u09c7 \u099c\u09c0\u09ac\u09a8 \u09b6\u09c1\u09b0\u09c1 \u0995\u09b0\u09c7, \u09aa\u09b0\u09c7 \u09ae\u09be\u099f\u09bf\u09b0 \u09a6\u09bf\u0995\u09c7 \u09b6\u09bf\u0995\u09a1\u09bc \u09aa\u09be\u09a0\u09be\u09af\u09bc\u0964\"\n      ],\n      vocab: [\n        { word: \"\u0995\u09be\u09a3\u09cd\u09a1\", def: \"\u0997\u09be\u099b\u09c7\u09b0 \u09ae\u09c2\u09b2 \u0985\u0982\u09b6, \u09af\u09c7 \u09ae\u09cb\u099f\u09be \u0985\u0982\u09b6\u099f\u09bf \u09a1\u09be\u09b2\u09aa\u09be\u09b2\u09be \u09a7\u09b0\u09c7 \u09b0\u09be\u0996\u09c7\u0964\" },\n        { word: \"\u0985\u0999\u09cd\u0995\u09c1\u09b0\u09bf\u09a4\", def: \"\u09ac\u09c7\u09a1\u09bc\u09c7 \u0993\u09a0\u09be \u09b6\u09c1\u09b0\u09c1 \u0995\u09b0\u09be\u0964 \u09ac\u09c0\u099c \u09a5\u09c7\u0995\u09c7 \u09aa\u09cd\u09b0\u09a5\u09ae \u099b\u09cb\u099f\u09cd\u099f \u0985\u0999\u09cd\u0995\u09c1\u09b0 \u09ac\u09c7\u09b0\u09cb\u09b2\u09c7 \u09a4\u09be \u0985\u0999\u09cd\u0995\u09c1\u09b0\u09bf\u09a4 \u09b9\u09af\u09bc\u0964\" }\n      ],\n      prompt: \"\u09a4\u09cb\u09ae\u09be\u09b0 \u09ac\u09be\u09a1\u09bc\u09bf\u09b0 \u0995\u09be\u099b\u09c7 \u098f\u09ae\u09a8 \u0995\u09cb\u09a8\u09cb \u0997\u09be\u099b \u0986\u099b\u09c7 \u09af\u09be \u09a4\u09cb\u09ae\u09be\u09b0 \u09aa\u09be\u09a1\u09bc\u09be\u09b0 \u0995\u09be\u099b\u09c7 \u0997\u09c1\u09b0\u09c1\u09a4\u09cd\u09ac\u09aa\u09c2\u09b0\u09cd\u09a3 \u09ae\u09a8\u09c7 \u09b9\u09af\u09bc?\"\n    },\n    mr: {\n      title: \"\u0935\u0921\u093e\u091a\u0947 \u091d\u093e\u0921\",\n      paragraphs: [\n        \"\u092d\u093e\u0930\u0924\u093e\u0924\u0940\u0932 \u0905\u0928\u0947\u0915 \u0917\u093e\u0935\u093e\u0902\u0924 \u091a\u094c\u0915\u093e\u091a\u094d\u092f\u093e \u092e\u0927\u094d\u092f\u092d\u093e\u0917\u0940 \u0938\u0930\u094d\u0935\u093e\u0924 \u092e\u094b\u0920\u0947 \u091d\u093e\u0921 \u0935\u0921\u093e\u091a\u0947 \u0905\u0938\u0924\u0947. \u0935\u0921 \u0907\u0924\u0930 \u091d\u093e\u0921\u093e\u0902\u0938\u093e\u0930\u0916\u0947 \u0909\u0902\u091a \u0935\u093e\u0922\u0924 \u0928\u093e\u0939\u0940. \u0909\u0932\u091f \u0924\u0947 \u0930\u0941\u0902\u0926\u0940\u0928\u0947 \u092a\u0938\u0930\u0924\u0947. \u0924\u094d\u092f\u093e\u091a\u094d\u092f\u093e \u092b\u093e\u0902\u0926\u094d\u092f\u093e \u0926\u0942\u0930\u0935\u0930 \u091c\u093e\u0924\u093e\u0924, \u0906\u0923\u093f \u0924\u094d\u092f\u093e \u092b\u093e\u0902\u0926\u094d\u092f\u093e\u0902\u0924\u0942\u0928 \u0932\u093e\u0902\u092c \u092e\u0941\u0933\u0947 \u0926\u094b\u0930\u0940\u0938\u093e\u0930\u0916\u0940 \u0916\u093e\u0932\u0940 \u0932\u094b\u0902\u092c\u0924\u093e\u0924.\",\n        \"\u092e\u0941\u0933\u0947 \u091c\u092e\u093f\u0928\u0940\u0932\u093e \u0938\u094d\u092a\u0930\u094d\u0936 \u0915\u0930\u0924\u093e\u0924 \u0924\u0947\u0935\u094d\u0939\u093e \u0924\u0940 \u092e\u093e\u0924\u0940\u0924 \u0936\u093f\u0930\u0942\u0928 \u0928\u0935\u0947 \u0916\u094b\u0921 \u092c\u0928\u0924\u093e\u0924. \u0905\u0928\u0947\u0915 \u0935\u0930\u094d\u0937\u093e\u0902\u0928\u0902\u0924\u0930 \u090f\u0915 \u0935\u0921\u093e\u091a\u0947 \u091d\u093e\u0921 \u0932\u0939\u093e\u0928 \u091c\u0902\u0917\u0932\u093e\u0938\u093e\u0930\u0916\u0947 \u0926\u093f\u0938\u0924\u0947. \u092d\u093e\u0930\u0924\u093e\u0924\u0940\u0932 \u0915\u093e\u0939\u0940 \u0935\u0921 \u0926\u094b\u0928 \u0939\u091c\u093e\u0930 \u0935\u0930\u094d\u0937\u093e\u0902\u0939\u0942\u0928\u0939\u0940 \u091c\u0941\u0928\u0947 \u0906\u0939\u0947\u0924. \u0932\u094b\u0915 \u0924\u094d\u092f\u093e\u0916\u093e\u0932\u0940 \u092c\u0938\u0942\u0928 \u0935\u093f\u0936\u094d\u0930\u093e\u0902\u0924\u0940 \u0918\u0947\u0924\u093e\u0924, \u0917\u092a\u094d\u092a\u093e \u092e\u093e\u0930\u0924\u093e\u0924 \u0906\u0923\u093f \u0905\u092d\u094d\u092f\u093e\u0938 \u0915\u0930\u0924\u093e\u0924.\",\n        \"\u0936\u093e\u0938\u094d\u0924\u094d\u0930\u091c\u094d\u091e \u0935\u0921\u093e\u0932\u093e \u0905\u0902\u091c\u093f\u0930\u093e\u091a\u0947 \u091d\u093e\u0921 \u092e\u094d\u0939\u0923\u0924\u093e\u0924. \u0924\u094d\u092f\u093e\u091a\u0947 \u092b\u0933 \u0932\u0939\u093e\u0928 \u0906\u0923\u093f \u0917\u094b\u0932 \u0905\u0938\u0924\u0947, \u0906\u0923\u093f \u092a\u0915\u094d\u0937\u094d\u092f\u093e\u0902\u0928\u093e \u0924\u0947 \u0916\u0942\u092a \u0906\u0935\u0921\u0924\u0947. \u090f\u0916\u093e\u0926\u093e \u092a\u0915\u094d\u0937\u0940 \u0905\u0902\u091c\u0940\u0930 \u0916\u093e\u090a\u0928 \u0926\u0941\u0938\u0931\u094d\u092f\u093e \u091d\u093e\u0921\u093e\u0935\u0930 \u092c\u0938\u0932\u093e, \u0924\u0930 \u092c\u0940 \u0924\u094d\u092f\u093e\u091a \u091d\u093e\u0921\u093e\u091a\u094d\u092f\u093e \u092b\u093e\u0902\u0926\u0940\u0935\u0930 \u0930\u0941\u091c\u0942 \u0936\u0915\u0924\u0947. \u0905\u0936\u093e \u092a\u094d\u0930\u0915\u093e\u0930\u0947 \u0928\u0935\u0947 \u0935\u0921 \u0939\u0935\u0947\u0924 \u0909\u0902\u091a\u093e\u0935\u0930 \u091c\u0940\u0935\u0928 \u0938\u0941\u0930\u0942 \u0915\u0930\u0924\u093e\u0924, \u092e\u0917 \u091c\u092e\u093f\u0928\u0940\u0915\u0921\u0947 \u092e\u0941\u0933\u0947 \u092a\u093e\u0920\u0935\u0924\u093e\u0924.\"\n      ],\n      vocab: [\n        { word: \"\u0916\u094b\u0921\", def: \"\u091d\u093e\u0921\u093e\u091a\u093e \u092e\u0941\u0916\u094d\u092f \u092d\u093e\u0917, \u092b\u093e\u0902\u0926\u094d\u092f\u093e\u0902\u0928\u093e \u0924\u094b\u0932\u0942\u0928 \u0927\u0930\u0923\u093e\u0930\u093e \u091c\u093e\u0921 \u092d\u093e\u0917.\" },\n        { word: \"\u0930\u0941\u091c\u0942\", def: \"\u0935\u093e\u0922\u093e\u092f\u0932\u093e \u0938\u0941\u0930\u0941\u0935\u093e\u0924 \u0939\u094b\u0923\u0947. \u092c\u0940\u091a\u093e \u092a\u0939\u093f\u0932\u093e \u0915\u094b\u0902\u092c \u092c\u093e\u0939\u0947\u0930 \u0906\u0932\u093e \u0915\u0940 \u0924\u0947 \u0930\u0941\u091c\u0924\u0947.\" }\n      ],\n      prompt: \"\u0924\u0941\u092e\u091a\u094d\u092f\u093e \u0918\u0930\u093e\u091c\u0935\u0933 \u0905\u0938\u0947 \u090f\u0916\u093e\u0926\u0947 \u091d\u093e\u0921 \u0906\u0939\u0947 \u0915\u093e \u091c\u0947 \u0924\u0941\u092e\u091a\u094d\u092f\u093e \u0935\u0938\u094d\u0924\u0940\u0932\u093e \u092e\u0939\u0924\u094d\u0924\u094d\u0935\u093e\u091a\u0947 \u0935\u093e\u091f\u0924\u0947?\"\n    },\n    gu: {\n      title: \"\u0ab5\u0aa1\u0aa8\u0ac1\u0a82 \u0a9d\u0abe\u0aa1\",\n      paragraphs: [\n        \"\u0aad\u0abe\u0ab0\u0aa4\u0aa8\u0abe \u0a98\u0aa3\u0abe \u0a97\u0abe\u0aae\u0acb\u0aae\u0abe\u0a82 \u0a9a\u0acb\u0a95\u0aa8\u0ac0 \u0ab5\u0a9a\u0acd\u0a9a\u0ac7 \u0ab8\u0acc\u0aa5\u0ac0 \u0aae\u0acb\u0a9f\u0ac1\u0a82 \u0a9d\u0abe\u0aa1 \u0ab5\u0aa1 \u0ab9\u0acb\u0aaf \u0a9b\u0ac7. \u0ab5\u0aa1 \u0aac\u0ac0\u0a9c\u0abe\u0a82 \u0a9d\u0abe\u0aa1\u0aa8\u0ac0 \u0a9c\u0ac7\u0aae \u0a8a\u0a82\u0a9a\u0ac1\u0a82 \u0ab5\u0aa7\u0aa4\u0ac1\u0a82 \u0aa8\u0aa5\u0ac0. \u0aaa\u0aa3 \u0aa4\u0ac7 \u0aaa\u0ab9\u0acb\u0ab3\u0abe\u0a88\u0aae\u0abe\u0a82 \u0aab\u0ac7\u0ab2\u0abe\u0aaf \u0a9b\u0ac7. \u0aa4\u0ac7\u0aa8\u0ac0 \u0aa1\u0abe\u0ab3\u0ac0\u0a93 \u0aa6\u0ac2\u0ab0 \u0ab8\u0ac1\u0aa7\u0ac0 \u0a9c\u0abe\u0aaf \u0a9b\u0ac7, \u0a85\u0aa8\u0ac7 \u0a8f \u0aa1\u0abe\u0ab3\u0ac0\u0a93\u0aae\u0abe\u0a82\u0aa5\u0ac0 \u0ab2\u0abe\u0a82\u0aac\u0abe\u0a82 \u0aae\u0ac2\u0ab3 \u0aa6\u0acb\u0ab0\u0aa1\u0abe\u0a82\u0aa8\u0ac0 \u0a9c\u0ac7\u0aae \u0aa8\u0ac0\u0a9a\u0ac7 \u0ab2\u0a9f\u0a95\u0ac7 \u0a9b\u0ac7.\",\n        \"\u0aae\u0ac2\u0ab3 \u0a9c\u0aae\u0ac0\u0aa8\u0aa8\u0ac7 \u0a85\u0aa1\u0ac7 \u0aa4\u0acd\u0aaf\u0abe\u0ab0\u0ac7 \u0aae\u0abe\u0a9f\u0ac0\u0aae\u0abe\u0a82 \u0a8a\u0aa4\u0ab0\u0ac0\u0aa8\u0ac7 \u0aa8\u0ab5\u0abe\u0a82 \u0aa5\u0aa1 \u0aac\u0aa8\u0ac0 \u0a9c\u0abe\u0aaf \u0a9b\u0ac7. \u0a98\u0aa3\u0abe\u0a82 \u0ab5\u0ab0\u0acd\u0ab7\u0acb \u0aaa\u0a9b\u0ac0 \u0a8f\u0a95 \u0ab5\u0aa1 \u0aa8\u0abe\u0aa8\u0abe \u0a9c\u0a82\u0a97\u0ab2 \u0a9c\u0ac7\u0ab5\u0ac1\u0a82 \u0aa6\u0ac7\u0a96\u0abe\u0aaf \u0a9b\u0ac7. \u0aad\u0abe\u0ab0\u0aa4\u0aae\u0abe\u0a82 \u0a95\u0ac7\u0a9f\u0ab2\u0abe\u0a82\u0a95 \u0ab5\u0aa1 \u0aac\u0ac7 \u0ab9\u0a9c\u0abe\u0ab0 \u0ab5\u0ab0\u0acd\u0ab7\u0aa5\u0ac0\u0aaf \u0a9c\u0ac2\u0aa8\u0abe\u0a82 \u0a9b\u0ac7. \u0ab2\u0acb\u0a95\u0acb \u0aa4\u0ac7\u0aa8\u0ac0 \u0aa8\u0ac0\u0a9a\u0ac7 \u0aac\u0ac7\u0ab8\u0ac0\u0aa8\u0ac7 \u0a86\u0ab0\u0abe\u0aae \u0a95\u0ab0\u0ac7, \u0ab5\u0abe\u0aa4\u0acb \u0a95\u0ab0\u0ac7 \u0a85\u0aa8\u0ac7 \u0aad\u0aa3\u0ac7 \u0a9b\u0ac7.\",\n        \"\u0ab5\u0ac8\u0a9c\u0acd\u0a9e\u0abe\u0aa8\u0abf\u0a95\u0acb \u0ab5\u0aa1\u0aa8\u0ac7 \u0a85\u0a82\u0a9c\u0ac0\u0ab0\u0aa8\u0ac1\u0a82 \u0a9d\u0abe\u0aa1 \u0a95\u0ab9\u0ac7 \u0a9b\u0ac7. \u0aa4\u0ac7\u0aa8\u0ac1\u0a82 \u0aab\u0ab3 \u0aa8\u0abe\u0aa8\u0ac1\u0a82 \u0aa8\u0ac7 \u0a97\u0acb\u0ab3 \u0ab9\u0acb\u0aaf \u0a9b\u0ac7, \u0a85\u0aa8\u0ac7 \u0aaa\u0a95\u0acd\u0ab7\u0ac0\u0a93\u0aa8\u0ac7 \u0aac\u0ab9\u0ac1 \u0a97\u0aae\u0ac7 \u0a9b\u0ac7. \u0a95\u0acb\u0a88 \u0aaa\u0a95\u0acd\u0ab7\u0ac0 \u0a85\u0a82\u0a9c\u0ac0\u0ab0 \u0a96\u0abe\u0a88\u0aa8\u0ac7 \u0aac\u0ac0\u0a9c\u0abe \u0a9d\u0abe\u0aa1 \u0aaa\u0ab0 \u0aac\u0ac7\u0ab8\u0ac7, \u0aa4\u0acd\u0aaf\u0abe\u0ab0\u0ac7 \u0aac\u0ac0\u0a9c \u0a8f \u0a9c \u0a9d\u0abe\u0aa1\u0aa8\u0ac0 \u0aa1\u0abe\u0ab3\u0ac0 \u0aaa\u0ab0 \u0a8a\u0a97\u0ac0 \u0ab6\u0a95\u0ac7 \u0a9b\u0ac7. \u0a86\u0aae \u0aa8\u0ab5\u0abe\u0a82 \u0ab5\u0aa1 \u0ab9\u0ab5\u0abe\u0aae\u0abe\u0a82 \u0a8a\u0a82\u0a9a\u0ac7 \u0a9c\u0ac0\u0ab5\u0aa8 \u0ab6\u0ab0\u0ac2 \u0a95\u0ab0\u0ac7 \u0a9b\u0ac7, \u0aaa\u0a9b\u0ac0 \u0a9c\u0aae\u0ac0\u0aa8 \u0aa4\u0ab0\u0aab \u0aae\u0ac2\u0ab3 \u0aae\u0acb\u0a95\u0ab2\u0ac7 \u0a9b\u0ac7.\"\n      ],\n      vocab: [\n        { word: \"\u0aa5\u0aa1\", def: \"\u0a9d\u0abe\u0aa1\u0aa8\u0acb \u0aae\u0ac1\u0a96\u0acd\u0aaf \u0aad\u0abe\u0a97, \u0aa1\u0abe\u0ab3\u0ac0\u0a93\u0aa8\u0ac7 \u0a9f\u0ac7\u0a95\u0ab5\u0ac0 \u0ab0\u0abe\u0a96\u0aa4\u0acb \u0a9c\u0abe\u0aa1\u0acb \u0aad\u0abe\u0a97.\" },\n        { word: \"\u0a8a\u0a97\u0ac0\", def: \"\u0ab5\u0aa7\u0ab5\u0abe\u0aa8\u0ac1\u0a82 \u0ab6\u0ab0\u0ac2 \u0aa5\u0ab5\u0ac1\u0a82. \u0aac\u0ac0\u0a9c\u0aa8\u0acb \u0aaa\u0ab9\u0ac7\u0ab2\u0acb \u0aa8\u0abe\u0aa8\u0acb \u0a85\u0a82\u0a95\u0ac1\u0ab0 \u0aa8\u0ac0\u0a95\u0ab3\u0ac7 \u0aa4\u0acd\u0aaf\u0abe\u0ab0\u0ac7 \u0aa4\u0ac7 \u0a8a\u0a97\u0ac7 \u0a9b\u0ac7.\" }\n      ],\n      prompt: \"\u0aa4\u0aae\u0abe\u0ab0\u0abe \u0a98\u0ab0\u0aa8\u0ac0 \u0aa8\u0a9c\u0ac0\u0a95 \u0a8f\u0ab5\u0ac1\u0a82 \u0a95\u0acb\u0a88 \u0a9d\u0abe\u0aa1 \u0a9b\u0ac7 \u0a9c\u0ac7 \u0aa4\u0aae\u0abe\u0ab0\u0abe \u0ab5\u0abf\u0ab8\u0acd\u0aa4\u0abe\u0ab0 \u0aae\u0abe\u0a9f\u0ac7 \u0aae\u0ab9\u0aa4\u0acd\u0aa4\u0acd\u0ab5\u0aa8\u0ac1\u0a82 \u0ab2\u0abe\u0a97\u0ac7?\"\n    },\n    te: {\n      title: \"\u0c2e\u0c30\u0c4d\u0c30\u0c3f \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41\",\n      paragraphs: [\n        \"\u0c2d\u0c3e\u0c30\u0c24\u0c26\u0c47\u0c36\u0c02\u0c32\u0c4b\u0c28\u0c3f \u0c1a\u0c3e\u0c32\u0c3e \u0c17\u0c4d\u0c30\u0c3e\u0c2e\u0c3e\u0c32\u0c4d\u0c32\u0c4b \u0c28\u0c21\u0c3f\u0c2c\u0c4a\u0c21\u0c4d\u0c21\u0c41\u0c28 \u0c09\u0c02\u0c21\u0c47 \u0c05\u0c24\u0c3f\u0c2a\u0c46\u0c26\u0c4d\u0c26 \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c2e\u0c30\u0c4d\u0c30\u0c3f. \u0c2e\u0c30\u0c4d\u0c30\u0c3f \u0c07\u0c24\u0c30 \u0c1a\u0c46\u0c1f\u0c4d\u0c32\u0c32\u0c3e \u0c0e\u0c24\u0c4d\u0c24\u0c41\u0c17\u0c3e \u0c2a\u0c46\u0c30\u0c17\u0c26\u0c41. \u0c2c\u0c26\u0c41\u0c32\u0c41\u0c17\u0c3e \u0c05\u0c26\u0c3f \u0c35\u0c46\u0c21\u0c32\u0c4d\u0c2a\u0c41\u0c17\u0c3e \u0c35\u0c3f\u0c38\u0c4d\u0c24\u0c30\u0c3f\u0c38\u0c4d\u0c24\u0c41\u0c02\u0c26\u0c3f. \u0c26\u0c3e\u0c28\u0c3f \u0c15\u0c4a\u0c2e\u0c4d\u0c2e\u0c32\u0c41 \u0c26\u0c42\u0c30\u0c02\u0c17\u0c3e \u0c1a\u0c3e\u0c1a\u0c41\u0c15\u0c41\u0c02\u0c1f\u0c3e\u0c2f\u0c3f, \u0c06 \u0c15\u0c4a\u0c2e\u0c4d\u0c2e\u0c32 \u0c28\u0c41\u0c02\u0c21\u0c3f \u0c2a\u0c4a\u0c21\u0c35\u0c48\u0c28 \u0c35\u0c47\u0c30\u0c4d\u0c32\u0c41 \u0c24\u0c3e\u0c33\u0c4d\u0c33\u0c32\u0c3e \u0c15\u0c3f\u0c02\u0c26\u0c3f\u0c15\u0c3f \u0c35\u0c47\u0c32\u0c3e\u0c21\u0c24\u0c3e\u0c2f\u0c3f.\",\n        \"\u0c35\u0c47\u0c30\u0c4d\u0c32\u0c41 \u0c28\u0c47\u0c32\u0c28\u0c41 \u0c24\u0c3e\u0c15\u0c3f\u0c28\u0c2a\u0c4d\u0c2a\u0c41\u0c21\u0c41 \u0c2e\u0c1f\u0c4d\u0c1f\u0c3f\u0c32\u0c4b\u0c15\u0c3f \u0c26\u0c3f\u0c17\u0c3f \u0c15\u0c4a\u0c24\u0c4d\u0c24 \u0c15\u0c3e\u0c02\u0c21\u0c3e\u0c32\u0c41\u0c17\u0c3e \u0c2e\u0c3e\u0c30\u0c24\u0c3e\u0c2f\u0c3f. \u0c1a\u0c3e\u0c32\u0c3e \u0c0f\u0c33\u0c4d\u0c33 \u0c24\u0c30\u0c4d\u0c35\u0c3e\u0c24 \u0c12\u0c15 \u0c2e\u0c30\u0c4d\u0c30\u0c3f \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c12\u0c15 \u0c1a\u0c3f\u0c28\u0c4d\u0c28 \u0c05\u0c21\u0c35\u0c3f\u0c32\u0c3e \u0c15\u0c28\u0c3f\u0c2a\u0c3f\u0c38\u0c4d\u0c24\u0c41\u0c02\u0c26\u0c3f. \u0c2d\u0c3e\u0c30\u0c24\u0c26\u0c47\u0c36\u0c02\u0c32\u0c4b \u0c15\u0c4a\u0c28\u0c4d\u0c28\u0c3f \u0c2e\u0c30\u0c4d\u0c30\u0c3f \u0c1a\u0c46\u0c1f\u0c4d\u0c32\u0c41 \u0c30\u0c46\u0c02\u0c21\u0c41 \u0c35\u0c47\u0c32 \u0c0f\u0c33\u0c4d\u0c33\u0c15\u0c41 \u0c2a\u0c48\u0c17\u0c3e \u0c2a\u0c41\u0c30\u0c3e\u0c24\u0c28\u0c2e\u0c48\u0c28\u0c35\u0c3f. \u0c2a\u0c4d\u0c30\u0c1c\u0c32\u0c41 \u0c35\u0c3e\u0c1f\u0c3f \u0c15\u0c3f\u0c02\u0c26 \u0c15\u0c42\u0c30\u0c4d\u0c1a\u0c41\u0c28\u0c3f \u0c35\u0c3f\u0c36\u0c4d\u0c30\u0c3e\u0c02\u0c24\u0c3f \u0c24\u0c40\u0c38\u0c41\u0c15\u0c41\u0c02\u0c1f\u0c3e\u0c30\u0c41, \u0c2e\u0c3e\u0c1f\u0c4d\u0c32\u0c3e\u0c21\u0c41\u0c15\u0c41\u0c02\u0c1f\u0c3e\u0c30\u0c41, \u0c1a\u0c26\u0c41\u0c35\u0c41\u0c15\u0c41\u0c02\u0c1f\u0c3e\u0c30\u0c41.\",\n        \"\u0c36\u0c3e\u0c38\u0c4d\u0c24\u0c4d\u0c30\u0c35\u0c47\u0c24\u0c4d\u0c24\u0c32\u0c41 \u0c2e\u0c30\u0c4d\u0c30\u0c3f\u0c28\u0c3f \u0c05\u0c24\u0c4d\u0c24\u0c3f \u0c1c\u0c3e\u0c24\u0c3f \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c05\u0c02\u0c1f\u0c3e\u0c30\u0c41. \u0c26\u0c3e\u0c28\u0c3f \u0c2a\u0c02\u0c21\u0c41 \u0c1a\u0c3f\u0c28\u0c4d\u0c28\u0c17\u0c3e, \u0c17\u0c41\u0c02\u0c21\u0c4d\u0c30\u0c02\u0c17\u0c3e \u0c09\u0c02\u0c1f\u0c41\u0c02\u0c26\u0c3f, \u0c2a\u0c15\u0c4d\u0c37\u0c41\u0c32\u0c15\u0c41 \u0c1a\u0c3e\u0c32\u0c3e \u0c07\u0c37\u0c4d\u0c1f\u0c02. \u0c12\u0c15 \u0c2a\u0c15\u0c4d\u0c37\u0c3f \u0c05\u0c24\u0c4d\u0c24\u0c3f \u0c24\u0c3f\u0c28\u0c3f \u0c2e\u0c30\u0c4b \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41\u0c2a\u0c48 \u0c35\u0c3e\u0c32\u0c3f\u0c24\u0c47, \u0c35\u0c3f\u0c24\u0c4d\u0c24\u0c28\u0c02 \u0c06 \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c15\u0c4a\u0c2e\u0c4d\u0c2e\u0c2a\u0c48\u0c28\u0c47 \u0c2e\u0c4a\u0c32\u0c15\u0c46\u0c24\u0c4d\u0c24\u0c35\u0c1a\u0c4d\u0c1a\u0c41. \u0c07\u0c32\u0c3e \u0c15\u0c4a\u0c24\u0c4d\u0c24 \u0c2e\u0c30\u0c4d\u0c30\u0c3f \u0c1a\u0c46\u0c1f\u0c4d\u0c32\u0c41 \u0c17\u0c3e\u0c32\u0c3f\u0c32\u0c4b \u0c0e\u0c24\u0c4d\u0c24\u0c41\u0c28 \u0c1c\u0c40\u0c35\u0c3f\u0c24\u0c02 \u0c2e\u0c4a\u0c26\u0c32\u0c41\u0c2a\u0c46\u0c1f\u0c4d\u0c1f\u0c3f, \u0c24\u0c30\u0c4d\u0c35\u0c3e\u0c24 \u0c28\u0c47\u0c32 \u0c35\u0c48\u0c2a\u0c41 \u0c35\u0c47\u0c30\u0c4d\u0c32\u0c41 \u0c2a\u0c02\u0c2a\u0c41\u0c24\u0c3e\u0c2f\u0c3f.\"\n      ],\n      vocab: [\n        { word: \"\u0c15\u0c3e\u0c02\u0c21\u0c02\", def: \"\u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c2a\u0c4d\u0c30\u0c27\u0c3e\u0c28 \u0c2d\u0c3e\u0c17\u0c02, \u0c15\u0c4a\u0c2e\u0c4d\u0c2e\u0c32\u0c28\u0c41 \u0c28\u0c3f\u0c32\u0c2c\u0c46\u0c1f\u0c4d\u0c1f\u0c47 \u0c2e\u0c02\u0c26\u0c2e\u0c48\u0c28 \u0c2d\u0c3e\u0c17\u0c02.\" },\n        { word: \"\u0c2e\u0c4a\u0c32\u0c15\", def: \"\u0c2a\u0c46\u0c30\u0c17\u0c21\u0c02 \u0c2e\u0c4a\u0c26\u0c32\u0c35\u0c21\u0c02. \u0c35\u0c3f\u0c24\u0c4d\u0c24\u0c28\u0c02 \u0c28\u0c41\u0c02\u0c21\u0c3f \u0c2e\u0c4a\u0c26\u0c1f\u0c3f \u0c1a\u0c3f\u0c28\u0c4d\u0c28 \u0c2e\u0c4a\u0c32\u0c15 \u0c2c\u0c2f\u0c1f\u0c15\u0c41 \u0c35\u0c1a\u0c4d\u0c1a\u0c3f\u0c28\u0c2a\u0c4d\u0c2a\u0c41\u0c21\u0c41 \u0c05\u0c26\u0c3f \u0c2e\u0c4a\u0c32\u0c15\u0c46\u0c24\u0c4d\u0c24\u0c41\u0c24\u0c41\u0c02\u0c26\u0c3f.\" }\n      ],\n      prompt: \"\u0c2e\u0c40 \u0c07\u0c02\u0c1f\u0c3f \u0c26\u0c17\u0c4d\u0c17\u0c30 \u0c2e\u0c40 \u0c2a\u0c30\u0c3f\u0c38\u0c30\u0c3e\u0c32\u0c15\u0c41 \u0c2e\u0c41\u0c16\u0c4d\u0c2f\u0c2e\u0c48\u0c28\u0c26\u0c3f\u0c17\u0c3e \u0c05\u0c28\u0c3f\u0c2a\u0c3f\u0c02\u0c1a\u0c47 \u0c1a\u0c46\u0c1f\u0c4d\u0c1f\u0c41 \u0c0f\u0c26\u0c48\u0c28\u0c3e \u0c09\u0c02\u0c26\u0c3e?\"\n    }\n  },\n  {\n    id: \"rani\", cat: \"stories\", minutes: 4, level: \"Easy\", gmin: 4, gmax: 7, needs: [\"adhd\", \"autism\"],\n    en: {\n      title: \"Rani's Rainy Day\",\n      paragraphs: [\n        \"Rani stood at the door of her flat in Mumbai and watched the rain. It had been raining for three days. The road was a long brown river now. Cars moved slowly through it, and people waded with their slippers in their hands.\",\n        \"Her grandmother handed her a cup of warm chai. \\\"In the monsoon,\\\" her grandmother said, \\\"everything slows down. That is the gift of it. The city has to learn patience.\\\"\",\n        \"Rani thought about her week. School was cancelled. Her friends were stuck at home too. Usually she felt rushed. Today, there was nothing to rush toward. She drank her chai slowly and watched a frog sit very still on the windowsill, waiting out the rain.\",\n        \"When the rain finally stopped, the air smelled clean. Children came out and splashed in the puddles. Rani went to join them. The road was still a mess, but no one minded.\"\n      ],\n      vocab: [\n        { word: \"monsoon\", def: \"The rainy season in South Asia, when it rains heavily for weeks at a time.\" },\n        { word: \"patience\", def: \"The ability to wait calmly without getting upset.\" }\n      ],\n      prompt: \"When does your world slow down? What does that feel like?\"\n    },\n    hi: {\n      title: \"\u0930\u093e\u0928\u0940 \u0915\u093e \u092c\u0930\u0938\u093e\u0924\u0940 \u0926\u093f\u0928\",\n      paragraphs: [\n        \"\u0930\u093e\u0928\u0940 \u092e\u0941\u0902\u092c\u0908 \u092e\u0947\u0902 \u0905\u092a\u0928\u0947 \u092b\u094d\u0932\u0948\u091f \u0915\u0947 \u0926\u0930\u0935\u093e\u091c\u093c\u0947 \u092a\u0930 \u0916\u0921\u093c\u0940 \u0939\u094b\u0915\u0930 \u092c\u093e\u0930\u093f\u0936 \u0926\u0947\u0916 \u0930\u0939\u0940 \u0925\u0940\u0964 \u0924\u0940\u0928 \u0926\u093f\u0928 \u0938\u0947 \u092c\u093e\u0930\u093f\u0936 \u0939\u094b \u0930\u0939\u0940 \u0925\u0940\u0964 \u0938\u0921\u093c\u0915 \u0905\u092c \u090f\u0915 \u0932\u0902\u092c\u0940 \u092d\u0942\u0930\u0940 \u0928\u0926\u0940 \u092c\u0928 \u0917\u0908 \u0925\u0940\u0964 \u0909\u0938\u092e\u0947\u0902 \u0938\u0947 \u0915\u093e\u0930\u0947\u0902 \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u091a\u0932 \u0930\u0939\u0940 \u0925\u0940\u0902, \u0914\u0930 \u0932\u094b\u0917 \u0939\u093e\u0925 \u092e\u0947\u0902 \u091a\u092a\u094d\u092a\u0932\u0947\u0902 \u0932\u093f\u090f \u092a\u093e\u0928\u0940 \u092e\u0947\u0902 \u091a\u0932 \u0930\u0939\u0947 \u0925\u0947\u0964\",\n        \"\u0909\u0938\u0915\u0940 \u0926\u093e\u0926\u0940 \u0928\u0947 \u0909\u0938\u0947 \u0917\u0930\u092e \u091a\u093e\u092f \u0915\u093e \u090f\u0915 \u0915\u092a \u0925\u092e\u093e\u092f\u093e\u0964 \u0926\u093e\u0926\u0940 \u0928\u0947 \u0915\u0939\u093e, \\\"\u092c\u0930\u0938\u093e\u0924 \u092e\u0947\u0902 \u0938\u092c \u0915\u0941\u091b \u0927\u0940\u092e\u093e \u0939\u094b \u091c\u093e\u0924\u093e \u0939\u0948\u0964 \u092f\u0939\u0940 \u0924\u094b \u0907\u0938\u0915\u093e \u0924\u094b\u0939\u092b\u093c\u093e \u0939\u0948\u0964 \u0936\u0939\u0930 \u0915\u094b \u0927\u0948\u0930\u094d\u092f \u0938\u0940\u0916\u0928\u093e \u092a\u0921\u093c\u0924\u093e \u0939\u0948\u0964\\\"\",\n        \"\u0930\u093e\u0928\u0940 \u0928\u0947 \u0905\u092a\u0928\u0947 \u0939\u092b\u093c\u094d\u0924\u0947 \u0915\u0947 \u092c\u093e\u0930\u0947 \u092e\u0947\u0902 \u0938\u094b\u091a\u093e\u0964 \u0938\u094d\u0915\u0942\u0932 \u092c\u0902\u0926 \u0925\u093e\u0964 \u0909\u0938\u0915\u0947 \u0926\u094b\u0938\u094d\u0924 \u092d\u0940 \u0918\u0930 \u092e\u0947\u0902 \u092b\u0901\u0938\u0947 \u0925\u0947\u0964 \u0906\u092e\u0924\u094c\u0930 \u092a\u0930 \u0909\u0938\u0947 \u091c\u0932\u094d\u0926\u0940 \u0930\u0939\u0924\u0940 \u0925\u0940\u0964 \u0906\u091c, \u091c\u0932\u094d\u0926\u0940 \u091c\u093e\u0928\u0947 \u0915\u094b \u0915\u0941\u091b \u0928\u0939\u0940\u0902 \u0925\u093e\u0964 \u0909\u0938\u0928\u0947 \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u091a\u093e\u092f \u092a\u0940 \u0914\u0930 \u0916\u093f\u0921\u093c\u0915\u0940 \u0915\u0940 \u091a\u094c\u0916\u091f \u092a\u0930 \u090f\u0915 \u092e\u0947\u0902\u0922\u0915 \u0915\u094b \u092c\u093f\u0932\u094d\u0915\u0941\u0932 \u0936\u093e\u0902\u0924 \u092c\u0948\u0920\u0947, \u092c\u093e\u0930\u093f\u0936 \u0925\u092e\u0928\u0947 \u0915\u093e \u0907\u0902\u0924\u091c\u093c\u093e\u0930 \u0915\u0930\u0924\u0947 \u0926\u0947\u0916\u093e\u0964\",\n        \"\u091c\u092c \u0906\u0916\u093c\u093f\u0930\u0915\u093e\u0930 \u092c\u093e\u0930\u093f\u0936 \u0930\u0941\u0915\u0940, \u0924\u094b \u0939\u0935\u093e \u0938\u093e\u092b\u093c \u092e\u0939\u0915\u0928\u0947 \u0932\u0917\u0940\u0964 \u092c\u091a\u094d\u091a\u0947 \u092c\u093e\u0939\u0930 \u0906\u0915\u0930 \u092a\u093e\u0928\u0940 \u0915\u0947 \u0917\u0921\u094d\u0922\u094b\u0902 \u092e\u0947\u0902 \u091b\u092a\u091b\u092a \u0915\u0930\u0928\u0947 \u0932\u0917\u0947\u0964 \u0930\u093e\u0928\u0940 \u092d\u0940 \u0909\u0928\u0915\u0947 \u0938\u093e\u0925 \u0939\u094b \u0932\u0940\u0964 \u0938\u0921\u093c\u0915 \u0905\u092c \u092d\u0940 \u0917\u0902\u0926\u0940 \u0925\u0940, \u092a\u0930 \u0915\u093f\u0938\u0940 \u0915\u094b \u092a\u0930\u0935\u093e\u0939 \u0928\u0939\u0940\u0902 \u0925\u0940\u0964\"\n      ],\n      vocab: [\n        { word: \"\u092c\u0930\u0938\u093e\u0924\", def: \"\u0926\u0915\u094d\u0937\u093f\u0923 \u090f\u0936\u093f\u092f\u093e \u0915\u093e \u0935\u0930\u094d\u0937\u093e \u0915\u093e \u092e\u094c\u0938\u092e, \u091c\u092c \u0939\u092b\u093c\u094d\u0924\u094b\u0902 \u0924\u0915 \u0924\u0947\u091c\u093c \u092c\u093e\u0930\u093f\u0936 \u0939\u094b\u0924\u0940 \u0939\u0948\u0964\" },\n        { word: \"\u0927\u0948\u0930\u094d\u092f\", def: \"\u092c\u093f\u0928\u093e \u092a\u0930\u0947\u0936\u093e\u0928 \u0939\u0941\u090f \u0936\u093e\u0902\u0924\u093f \u0938\u0947 \u0907\u0902\u0924\u091c\u093c\u093e\u0930 \u0915\u0930\u0928\u0947 \u0915\u0940 \u0915\u094d\u0937\u092e\u0924\u093e\u0964\" }\n      ],\n      prompt: \"\u0906\u092a\u0915\u0940 \u0926\u0941\u0928\u093f\u092f\u093e \u0915\u092c \u0927\u0940\u092e\u0940 \u0939\u094b\u0924\u0940 \u0939\u0948? \u0935\u0939 \u0915\u0948\u0938\u093e \u092e\u0939\u0938\u0942\u0938 \u0939\u094b\u0924\u093e \u0939\u0948?\"\n    },\n    bn: {\n      title: \"\u09b0\u09be\u09a8\u09bf\u09b0 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf\u09b0 \u09a6\u09bf\u09a8\",\n      paragraphs: [\n        \"\u09b0\u09be\u09a8\u09bf \u09ae\u09c1\u09ae\u09cd\u09ac\u0987\u09af\u09bc\u09c7 \u09a4\u09be\u09b0 \u09ab\u09cd\u09b2\u09cd\u09af\u09be\u099f\u09c7\u09b0 \u09a6\u09b0\u099c\u09be\u09af\u09bc \u09a6\u09be\u0981\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u09a6\u09c7\u0996\u099b\u09bf\u09b2\u0964 \u09a4\u09bf\u09a8 \u09a6\u09bf\u09a8 \u09a7\u09b0\u09c7 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u09aa\u09a1\u09bc\u099b\u09bf\u09b2\u0964 \u09b0\u09be\u09b8\u09cd\u09a4\u09be\u099f\u09be \u098f\u0996\u09a8 \u098f\u0995\u099f\u09be \u09b2\u09ae\u09cd\u09ac\u09be \u09ac\u09be\u09a6\u09be\u09ae\u09bf \u09a8\u09a6\u09c0\u0964 \u09a4\u09be\u09b0 \u09ad\u09c7\u09a4\u09b0 \u09a6\u09bf\u09af\u09bc\u09c7 \u0997\u09be\u09a1\u09bc\u09bf \u09a7\u09c0\u09b0\u09c7 \u09a7\u09c0\u09b0\u09c7 \u099a\u09b2\u099b\u09bf\u09b2, \u0986\u09b0 \u09ae\u09be\u09a8\u09c1\u09b7 \u09b9\u09be\u09a4\u09c7 \u099a\u099f\u09bf \u09a8\u09bf\u09af\u09bc\u09c7 \u099c\u09b2\u09c7 \u09b9\u09c7\u0981\u099f\u09c7 \u09af\u09be\u099a\u09cd\u099b\u09bf\u09b2\u0964\",\n        \"\u09a4\u09be\u09b0 \u09a0\u09be\u0995\u09c1\u09ae\u09be \u09a4\u09be\u0995\u09c7 \u098f\u0995 \u0995\u09be\u09aa \u0997\u09b0\u09ae \u099a\u09be \u098f\u0997\u09bf\u09af\u09bc\u09c7 \u09a6\u09bf\u09b2\u09c7\u09a8\u0964 \u09a0\u09be\u0995\u09c1\u09ae\u09be \u09ac\u09b2\u09b2\u09c7\u09a8, \\\"\u09ac\u09b0\u09cd\u09b7\u09be\u09af\u09bc \u09b8\u09ac \u0995\u09bf\u099b\u09c1 \u09a7\u09c0\u09b0 \u09b9\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc\u0964 \u098f\u099f\u09be\u0987 \u098f\u09b0 \u0989\u09aa\u09b9\u09be\u09b0\u0964 \u09b6\u09b9\u09b0\u0995\u09c7 \u09a7\u09c8\u09b0\u09cd\u09af \u09b6\u09bf\u0996\u09a4\u09c7 \u09b9\u09af\u09bc\u0964\\\"\",\n        \"\u09b0\u09be\u09a8\u09bf \u09a4\u09be\u09b0 \u09b8\u09aa\u09cd\u09a4\u09be\u09b9\u09c7\u09b0 \u0995\u09a5\u09be \u09ad\u09be\u09ac\u09b2\u0964 \u09b8\u09cd\u0995\u09c1\u09b2 \u09ac\u09a8\u09cd\u09a7\u0964 \u09a4\u09be\u09b0 \u09ac\u09a8\u09cd\u09a7\u09c1\u09b0\u09be\u0993 \u0998\u09b0\u09c7 \u0986\u099f\u0995\u09c7\u0964 \u09b8\u09be\u09a7\u09be\u09b0\u09a3\u09a4 \u09a4\u09be\u09b0 \u09a4\u09be\u09a1\u09bc\u09be\u09b9\u09c1\u09a1\u09bc\u09cb \u09b2\u09be\u0997\u09a4\u0964 \u0986\u099c, \u09a4\u09be\u09a1\u09bc\u09be \u0995\u09b0\u09be\u09b0 \u09ae\u09a4\u09cb \u0995\u09bf\u099b\u09c1 \u099b\u09bf\u09b2 \u09a8\u09be\u0964 \u09b8\u09c7 \u09a7\u09c0\u09b0\u09c7 \u09a7\u09c0\u09b0\u09c7 \u099a\u09be \u0996\u09c7\u09b2 \u0986\u09b0 \u099c\u09be\u09a8\u09be\u09b2\u09be\u09b0 \u09a7\u09be\u09b0\u09c7 \u098f\u0995\u099f\u09be \u09ac\u09cd\u09af\u09be\u0999\u0995\u09c7 \u098f\u0995\u09c7\u09
